name: Dump 46b21431 audit protocol
on:
  push:
    branches: [dump-order-46b21431]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Dump audit
        run: |
          OID='46b21431-0d9f-488c-bdce-0fc1289f8784'
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT audit_json, candidate_json FROM custom_delivery_copy WHERE order_id='$OID'" > "$RUNNER_TEMP/au.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/au.json','utf8'));
          const rows=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];
          for(const r of rows){
            try{ const a=JSON.parse(r.audit_json||'null');
              console.log('AUDIT_PASS', a&&a.pass);
              console.log('AUDIT_KEYS', a&&Object.keys(a));
              console.log('AUDIT_ISSUES', JSON.stringify(a&&a.issues));
              if(a&&a.causalProof){
                const p=a.causalProof;
                console.log('PROOF_KEYS', Object.keys(p));
                console.log('PROOF_DISCOVERIES', (p.discoveries||[]).length);
                console.log('PROOF_CHRONOLOGY', (p.chronology||[]).length);
                console.log('PROOF_CHRON_STAGES', JSON.stringify((p.chronology||[]).map(c=>c.stageNumber)));
                console.log('PROOF_DISC_STAGES', JSON.stringify((p.discoveries||[]).map(c=>c.stageNumber)));
                console.log('PROOF_SAMPLE', JSON.stringify(p).slice(0,600));
              }
            }catch(e){ console.log('AUDIT_RAW', String(r.audit_json).slice(0,800)); }
          }
          NODE
