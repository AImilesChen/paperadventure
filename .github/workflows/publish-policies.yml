name: Publish approved policy versions
on:
  push:
    branches: [frontend-prd-v13-2026-10-08]
    paths:
      - shared/legal-profile.mjs
      - shared/legal-documents.mjs
      - scripts/prepare-legal-release.mjs
      - .github/workflows/publish-policies.yml
permissions:
  contents: read
concurrency:
  group: paper-adventure-policy-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:release
      - run: npm run build
      - name: Prepare explicitly approved immutable policies
        run: |
          node scripts/prepare-legal-release.mjs --published
          node --input-type=module -e "import fs from 'node:fs';const p='output/legal/publish-policies.sql';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replaceAll('INSERT INTO legal_documents','INSERT OR IGNORE INTO legal_documents'));"
      - name: Read database identifier
        run: |
          npx --yes wrangler@4.74.0 d1 info paper-adventure-stage-db --json > "$RUNNER_TEMP/paw-d1.json"
          node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/paw-d1.json','utf8'));const id=d.uuid||d.result?.uuid||d.database?.uuid;if(!/^[0-9a-f-]{36}$/i.test(id||''))throw Error('D1 UUID missing');fs.appendFileSync(process.env.GITHUB_ENV,'PAPER_ADVENTURE_STAGE_D1_ID='+id+'\n')"
      - name: Wait for matching support notification API
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent --show-error --max-time 10 https://paperadventure.app/api/v1/health > "$RUNNER_TEMP/support-health.json" && node -e "const v=require(process.env.RUNNER_TEMP+'/support-health.json');if(v.supportNotifications!==true||v.feedback!==true||v.checkoutMode!=='live')process.exit(1)"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Publish policy rows without changing payment flags or old orders
        run: |
          node scripts/write-stage-wrangler.mjs
          npx --yes wrangler@4.74.0 d1 execute DB --remote --config backend/wrangler.stage.generated.jsonc --file output/legal/publish-policies.sql
      - name: Verify public API serves the exact approved documents
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createPolicyDocuments} from './shared/legal-documents.mjs';
          for(const [kind,expected] of Object.entries(createPolicyDocuments())){
            let verified=false;
            for(let attempt=0;attempt<12;attempt++){
              try{
                const response=await fetch('https://paperadventure.app/api/v1/legal/'+kind,{signal:AbortSignal.timeout(15000)});
                assert.equal(response.status,200);
                const actual=await response.json();
                assert.equal(actual.title,expected.title);assert.equal(actual.effectiveAt,expected.effectiveAt);
                assert.ok(actual.version.startsWith(expected.version+'-'));assert.deepEqual(actual.sections,expected.sections);
                console.log('Verified approved policy: '+kind);verified=true;break;
              }catch{await new Promise(resolve=>setTimeout(resolve,5000));}
            }
            if(!verified)throw Error('Published policy mismatch: '+kind);
          }
          NODE
