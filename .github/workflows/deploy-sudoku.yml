name: Deploy Sudoku API and schema
on:
  push:
    branches: [frontend-prd-v13-2026-10-08]
    paths: [backend/sudoku-release.trigger]
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: paper-adventure-backend-stage
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAYMENTS_EXPECTED_MODE: live
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:sudoku
      - run: npm run test:backend
      - run: npm run test:release
      - name: Refuse bank downgrades or changed published puzzles
        run: node scripts/check-sudoku-bank-upgrade.mjs
      - name: Resolve existing database identifier
        run: |
          npx --yes wrangler@4.149.0 d1 info paper-adventure-stage-db --json > "$RUNNER_TEMP/paw-d1.json"
          node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/paw-d1.json','utf8'));const id=d.uuid||d.result?.uuid||d.database?.uuid;if(!/^[0-9a-f-]{36}$/i.test(id||''))throw Error('D1 UUID missing');fs.appendFileSync(process.env.GITHUB_ENV,'PAPER_ADVENTURE_STAGE_D1_ID='+id+'\n')"
      - name: Generate runtime config and record recovery bookmark
        run: |
          node scripts/write-stage-wrangler.mjs
          npx --yes wrangler@4.149.0 d1 time-travel info paper-adventure-stage-db --config backend/wrangler.stage.generated.jsonc --json > "$RUNNER_TEMP/sudoku-recovery-bookmark.json"
          echo 'Recovery bookmark recorded. Rollback keeps the additive Sudoku table and reverts code; restoring the whole database is not a normal rollback.'
      - name: Apply only the additive Sudoku migration and deploy existing API
        run: |
          mkdir -p backend/sudoku-migrations
          cp backend/migrations/0049_sudoku.sql backend/sudoku-migrations/
          node --input-type=module -e "import fs from 'node:fs';const p='backend/wrangler.stage.generated.jsonc';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.d1_databases[0].migrations_dir='./sudoku-migrations';fs.writeFileSync(p,JSON.stringify(c,null,2));"
          npx --yes wrangler@4.149.0 d1 migrations apply paper-adventure-stage-db --remote --config backend/wrangler.stage.generated.jsonc
          npx --yes wrangler@4.149.0 deploy --config backend/wrangler.stage.generated.jsonc --keep-vars
      - name: Verify public Sudoku API before releasing its interface
        run: node scripts/verify-sudoku-live.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sudoku-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/sudoku-recovery-bookmark.json
          if-no-files-found: ignore
          retention-days: 7
