name: Audit saved valid plan once without regenerating it
on:
  push:
    branches: [codex-79bb-reviewed-plan-20261016]
    paths: [.github/workflows/repair-authorized-plan.yml]
permissions:
  contents: read
concurrency:
  group: operator-reviewed-plan-79bb-20261016
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.DEEPSEEK_KEY || secrets.DEEPSEEK_API_TOKEN }}
      CONFIRM_SCOPED_PLAN_REPAIR: '79bb86c7-93b0-4088-ba7a-4a04cd1b2f34'
      VERIFY_SAVED_PLAN_ONLY: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: One independent audit of the same saved valid plan; three calls lifetime
        run: node scripts/repair-79bb-plan.mjs
