name: Pinpoint current paid remake rule without story logs
on:
  push:
    branches: [codex-remake-diagnostic-20261015]
    paths: [.github/workflows/diagnose-current-remake.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Print exact validation rule identifier only
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT CASE WHEN lower(error_detail) LIKE '%must name a specific repair or action%' THEN 'GENERIC_FINAL_CHOICE' WHEN lower(error_detail) LIKE '%three distinct final actions%' THEN 'DUPLICATE_FINAL_ACTIONS' WHEN lower(error_detail) LIKE '%each final action must name%' THEN 'UNSPECIFIC_FINAL_ACTION' WHEN lower(error_detail) LIKE '%final action % must be printable%' THEN 'FINAL_ACTION_LENGTH' WHEN lower(error_detail) LIKE '%story frame needs one problem%' THEN 'FRAME_SHAPE' WHEN lower(error_detail) LIKE '%printed names leave no room%' THEN 'STORY_LINK_FIT' WHEN lower(error_detail) LIKE '%before the final action%' THEN 'PREMATURE_GOAL_COMPLETION' WHEN lower(error_detail) LIKE '%supported action%' THEN 'SUPPORTED_ACTION_FORMAT' WHEN lower(error_detail) LIKE '%intended final action%' THEN 'DISCOVERY_ACTION_LINK' WHEN lower(error_detail) LIKE '%final choice%' THEN 'FINAL_CHOICE_OTHER' WHEN lower(error_detail) LIKE '%final action%' THEN 'FINAL_ACTION_OTHER' ELSE 'OTHER' END AS rule_id,COUNT(*) AS attempts FROM custom_pack_remake_calls WHERE order_id='f72e24d9-6a9e-4f1f-8d16-af1432b459bd' AND quality_epoch=(SELECT quality_epoch FROM custom_pack_remakes WHERE order_id='f72e24d9-6a9e-4f1f-8d16-af1432b459bd') AND logic_epoch=(SELECT logic_epoch FROM custom_pack_remakes WHERE order_id='f72e24d9-6a9e-4f1f-8d16-af1432b459bd') AND phase='blueprint' AND status='failed' GROUP BY rule_id"
