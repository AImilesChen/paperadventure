name: Classify current paid remake failure without story logs
on:
  push:
    branches: [codex-remake-diagnostic-20261015]
    paths: [.github/workflows/diagnose-current-remake.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Print validation category only
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT phase,status,error_code,CASE WHEN lower(error_detail) LIKE '%goal%open%' OR lower(error_detail) LIKE '%mission%unresolved%' OR lower(error_detail) LIKE '%completed outcome%' THEN 'PREMATURE_GOAL_COMPLETION' WHEN lower(error_detail) LIKE '%consequence%' OR lower(error_detail) LIKE '%discovery%' OR lower(error_detail) LIKE '%story link%' OR lower(error_detail) LIKE '%supports%' THEN 'DISCOVERY_CAUSAL_LINK' WHEN lower(error_detail) LIKE '%final action%' OR lower(error_detail) LIKE '%resolution%' THEN 'FINAL_ACTION_LINK' WHEN lower(error_detail) LIKE '%record fact%' OR lower(error_detail) LIKE '%feature%' THEN 'PRINTED_RECORD_FACTS' WHEN lower(error_detail) LIKE '%ordering pieces%' OR lower(error_detail) LIKE '%unfinished in-world actions%' THEN 'ORDERING_ACTIONS' WHEN lower(error_detail) LIKE '%paper material%' OR lower(error_detail) LIKE '%paper activities%' THEN 'MATERIAL_CONTRACT' WHEN lower(error_detail) LIKE '%celebration%' OR lower(error_detail) LIKE '%ending%' THEN 'ENDING' WHEN lower(error_detail) LIKE '%distinct%' THEN 'DISTINCTNESS' WHEN lower(error_detail) LIKE '%printable english%' THEN 'PRINTABLE_TEXT' WHEN lower(error_detail) LIKE '%too long%' OR lower(error_detail) LIKE '%under % characters%' THEN 'TEXT_LENGTH' ELSE 'OTHER_BLUEPRINT_RULE' END AS rule_category,COUNT(*) AS attempts,MAX(created_at) AS last_started,MAX(completed_at) AS last_completed FROM custom_pack_remake_calls WHERE order_id='f72e24d9-6a9e-4f1f-8d16-af1432b459bd' AND quality_epoch=(SELECT quality_epoch FROM custom_pack_remakes WHERE order_id='f72e24d9-6a9e-4f1f-8d16-af1432b459bd') AND logic_epoch=(SELECT logic_epoch FROM custom_pack_remakes WHERE order_id='f72e24d9-6a9e-4f1f-8d16-af1432b459bd') AND phase='blueprint' AND status='failed' GROUP BY phase,status,error_code,rule_category"
