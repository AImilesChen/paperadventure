name: Inspect current paid remake state without story logs
on:
  push:
    branches: [codex-remake-diagnostic-20261015]
    paths: [.github/workflows/diagnose-current-remake.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Read remake state metadata only
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT status,phase,error_code,lease_until,unixepoch() AS now_epoch,failure_count,recovery_round,logic_epoch,quality_epoch,json_extract(spec_json,'$.packQualityVersion') AS quality_version,CASE WHEN blueprint_json IS NULL THEN 0 ELSE 1 END AS blueprint_ready,COALESCE(json_array_length(stages_json),0) AS saved_stages,CASE WHEN story_json IS NULL THEN 0 ELSE 1 END AS story_ready,created_at,updated_at,completed_at FROM custom_pack_remakes WHERE order_id='f72e24d9-6a9e-4f1f-8d16-af1432b459bd'"
      - name: Read current call state metadata only
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT phase,stage_number,status,error_code,COUNT(*) AS row_count,MAX(created_at) AS last_started,MAX(completed_at) AS last_completed,COALESCE(SUM(input_tokens),0) AS input_tokens,COALESCE(SUM(output_tokens),0) AS output_tokens FROM custom_pack_remake_calls WHERE order_id='f72e24d9-6a9e-4f1f-8d16-af1432b459bd' AND quality_epoch=(SELECT quality_epoch FROM custom_pack_remakes WHERE order_id='f72e24d9-6a9e-4f1f-8d16-af1432b459bd') AND logic_epoch=(SELECT logic_epoch FROM custom_pack_remakes WHERE order_id='f72e24d9-6a9e-4f1f-8d16-af1432b459bd') GROUP BY phase,stage_number,status,error_code ORDER BY phase,stage_number,status"
