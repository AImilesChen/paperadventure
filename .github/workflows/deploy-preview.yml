name: Deploy public site and private preview

on:
  push:
    branches:
      - frontend-prd-v13-2026-10-08
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-adventure-preview-deploy
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      CLOUDFLARE_ACCOUNT_ID: "77bc392d46985cd3425691358f5e8a77"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:static
      - run: npm run test:sites
      - run: npm run test:backend
      - name: Bundle production API without publishing
        run: npx --yes wrangler@4.74.0 deploy --config backend/wrangler.production-smoke.jsonc --dry-run
      - name: Validate site Worker bundle without publishing
        run: npx --yes wrangler@4.74.0 deploy --config backend/wrangler.preview.jsonc --dry-run
      - name: Deploy verified public site when Cloudflare token is configured
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not configured; no deployment was attempted."
            exit 0
          fi
          npx --yes wrangler@4.74.0 deploy --config backend/wrangler.preview.jsonc --keep-vars
          asset_name=$(basename "$(find dist/client/assets -maxdepth 1 -name 'index-*.js' -print -quit)")
          test -n "$asset_name"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --head "https://paperadventure.app/assets/$asset_name" > /dev/null; then
              if curl --fail --silent --show-error --head https://paperadventure.app/en/for-home/ | grep -iq "x-robots-tag:.*noindex"; then
                echo "::error::The public Home page is still marked noindex."
                exit 1
              fi
              curl --fail --silent --show-error --head https://preview.paperadventure.app/en/ | grep -iq "x-robots-tag: noindex"
              curl --fail --silent --show-error --head https://paperadventure.app/en/account/ | grep -iq "x-robots-tag: noindex"
              curl --fail --silent --show-error https://paperadventure.app/robots.txt | grep -Fq "Sitemap: https://paperadventure.app/sitemap.xml"
              curl --fail --silent --show-error https://paperadventure.app/sitemap.xml | grep -Fq "https://paperadventure.app/en/for-home/"
              curl --fail --silent --show-error https://paperadventure.app/api/v1/health | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const v=JSON.parse(s);if(v.status!=='configured_runtime'||(v.checkout&&v.checkoutMode!=='test')||!v.generation||!v.proposals)throw Error('Apex API stage mismatch: '+s);console.log('Apex forwards API requests to the isolated backend')})"
              curl --fail --silent --show-error https://paperadventure.app/api/v1/catalog | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const v=JSON.parse(s);if(!Array.isArray(v.themes)||v.themes.length<6)throw Error('Apex catalog stage mismatch: '+s);console.log('Apex catalog is backed by the stage API')})"
              echo "Public content is indexable; preview and private routes remain noindex."
              exit 0
            fi
            sleep 5
          done
          echo "::error::The new public site could not be verified on paperadventure.app."
          exit 1


