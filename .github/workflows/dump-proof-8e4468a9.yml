name: Read delivery copy phase and error
on:
  push:
    branches: [dump-proof-8e4468a9]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Dump phase error detail
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT phase,error_code,error_detail,calls,candidate_json,repair_response_json FROM custom_delivery_copy WHERE order_id='8e4468a9-9847-43ae-b1b7-20e05c32f807'" > "$RUNNER_TEMP/d.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d.json','utf8'));
          const rows=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];
          for(const r of rows){
            console.log('PHASE', r.phase, 'CALLS', r.calls);
            console.log('ERROR_CODE', r.error_code);
            console.log('ERROR_DETAIL', r.error_detail);
            console.log('CANDIDATE_NULL', r.candidate_json===null||r.candidate_json===undefined);
            console.log('REPAIR_RESP_NULL', r.repair_response_json===null||r.repair_response_json===undefined);
            console.log('REPAIR_RESP_LEN', (r.repair_response_json||'').length);
          }
          NODE
