name: Read repair response status
on:
  push:
    branches: [dump-proof-8e4468a9]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Dump repair status and incomplete details
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT repair_response_json FROM custom_delivery_copy WHERE order_id='8e4468a9-9847-43ae-b1b7-20e05c32f807'" > "$RUNNER_TEMP/d.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d.json','utf8'));
          const rows=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];
          for(const r of rows){
            try{
              const b=JSON.parse(r.repair_response_json||'null');
              console.log('STATUS', b.status);
              console.log('INCOMPLETE', JSON.stringify(b.incomplete_details));
              console.log('USAGE', JSON.stringify(b.usage));
              console.log('REASONING_LEN', JSON.stringify(b.reasoning).length);
              const output=b.output||[];
              console.log('OUTPUT_TYPES', output.map(i=>({type:i.type, hasContent:i.content&&i.content.length})).map(JSON.stringify).join('|'));
              const txt=output.flatMap(i=>i.content||[]).filter(c=>c.type==='output_text').map(c=>c.text||'').join('');
              console.log('OUTPUT_TEXT_LEN', txt.length);
              console.log('OUTPUT_TEXT_HEAD', txt.slice(0,200));
              console.log('OUTPUT_TEXT_TAIL', txt.slice(-200));
            }catch(e){ console.log('PARSE_FAIL', e.message); }
          }
          NODE
