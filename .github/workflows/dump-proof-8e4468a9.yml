name: Read order quality version
on:
  push:
    branches: [dump-proof-8e4468a9]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Dump spec version fields
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT spec_json FROM custom_pack_remakes WHERE order_id='8e4468a9-9847-43ae-b1b7-20e05c32f807'" > "$RUNNER_TEMP/r.json"
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT story_spec_json FROM custom_activities WHERE id='8e4468a9-9847-43ae-b1b7-20e05c32f807'" > "$RUNNER_TEMP/a.json"
          node - <<'NODE'
          const fs=require('node:fs');
          function rows(f){
            try{
              const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+f,'utf8'));
              const arr=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];
              return arr;
            }catch(e){ return null; }
          }
          for(const f of ['r.json','a.json']){
            const arr=rows(f);
            console.log('=== '+f+' ===');
            if(!arr){ console.log('PARSE_ERROR'); continue; }
            for(const row of arr){
              const key = f==='r.json' ? 'spec_json' : 'story_spec_json';
              try{
                const s=JSON.parse(row[key]||'null');
                console.log('packQualityVersion=', s&&s.packQualityVersion);
                console.log('packCausalVersion=', s&&s.packCausalVersion);
                console.log('packExperienceVersion=', s&&s.packExperienceVersion);
                console.log('packCopyVersion=', s&&s.packCopyVersion);
              }catch(e){ console.log('SPEC_PARSE_FAIL'); }
            }
          }
          NODE
