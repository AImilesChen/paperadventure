name: Read story json keys
on:
  push:
    branches: [dump-proof-8e4468a9]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Dump story keys and spine
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT story_json FROM custom_pack_remakes WHERE order_id='8e4468a9-9847-43ae-b1b7-20e05c32f807'" > "$RUNNER_TEMP/d.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d.json','utf8'));
          const rows=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];
          for(const r of rows){
            try{
              const s=JSON.parse(r.story_json||'null');
              console.log('TOP_KEYS', s?Object.keys(s).join(','):'null');
              console.log('SPINE', JSON.stringify(s&&s.spine).slice(0,600));
              console.log('STAGE5', JSON.stringify(s&&s.stages&&s.stages[4]).slice(0,1200));
            }catch(e){ console.log('PARSE_FAIL', e.message); }
          }
          NODE
