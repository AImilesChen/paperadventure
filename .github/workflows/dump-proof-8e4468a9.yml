name: Read remake field state
on:
  push:
    branches: [dump-proof-8e4468a9]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Dump remake fields
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT status,phase,error_code,spec_json,blueprint_json,stages_json,story_json FROM custom_pack_remakes WHERE order_id='8e4468a9-9847-43ae-b1b7-20e05c32f807'" > "$RUNNER_TEMP/d.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d.json','utf8'));
          const rows=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];
          for(const r of rows){
            console.log('STATUS', r.status, 'PHASE', r.phase, 'ERROR', r.error_code);
            console.log('BLUEPRINT_NULL', r.blueprint_json===null);
            console.log('BLUEPRINT_LEN', (r.blueprint_json||'').length);
            console.log('STAGES_NULL', r.stages_json===null);
            console.log('STAGES_LEN', (r.stages_json||'').length);
            console.log('STORY_NULL', r.story_json===null);
            console.log('STORY_LEN', (r.story_json||'').length);
          }
          NODE
