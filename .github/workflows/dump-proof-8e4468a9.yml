name: Read blueprint actions and checkpoint1
on:
  push:
    branches: [dump-proof-8e4468a9]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Dump blueprint storyFrame and checkpoint1
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT blueprint_json FROM custom_pack_remakes WHERE order_id='8e4468a9-9847-43ae-b1b7-20e05c32f807'" > "$RUNNER_TEMP/d.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d.json','utf8'));
          const rows=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];
          for(const r of rows){
            try{
              const b=JSON.parse(r.blueprint_json||'null');
              console.log('BP_TOP_KEYS', b?Object.keys(b).join(','):'null');
              console.log('STORYFRAME_ACTIONS', JSON.stringify(b&&b.storyFrame&&b.storyFrame.actions));
              const st1=b&&b.stages&&b.stages[0];
              console.log('STAGE1_TYPE', st1&&st1.material&&st1.material.type);
              console.log('STAGE1_ITEMS', JSON.stringify(st1&&st1.material&&st1.material.items));
              console.log('STAGE1_ANSWERINDEX', st1&&st1.answerIndex);
              console.log('STAGE1_OPTIONS', JSON.stringify(st1&&st1.options));
            }catch(e){ console.log('PARSE_FAIL', e.message); }
          }
          NODE
