name: Verify two authorized theme covers
on:
  push:
    branches: [frontend-prd-v13-2026-10-08]
    paths: [backend/cover-repair.trigger]
permissions:
  contents: read
concurrency:
  group: paper-adventure-two-cover-check
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - name: Wait for the repaired live API
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent --show-error --max-time 10 https://paperadventure.app/api/v1/health > "$RUNNER_TEMP/cover-health.json" && node -e "const d=require(process.env.RUNNER_TEMP+'/cover-health.json');if(!d.supportNotifications||d.checkoutMode!=='live'||!d.themeCovers)process.exit(1)"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Read existing database binding
        run: |
          npx --yes wrangler@4.74.0 d1 info paper-adventure-stage-db --json > "$RUNNER_TEMP/paw-d1.json"
          node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/paw-d1.json','utf8'));const id=d.uuid||d.result?.uuid||d.database?.uuid;if(!/^[0-9a-f-]{36}$/i.test(id||''))throw Error('D1 UUID missing');fs.appendFileSync(process.env.GITHUB_ENV,'PAPER_ADVENTURE_STAGE_D1_ID='+id+'\n')"
      - name: Apply the audited one-use recovery to exactly two cover rows
        run: |
          node scripts/write-stage-wrangler.mjs
          npx --yes wrangler@4.74.0 d1 execute DB --remote --config backend/wrangler.stage.generated.jsonc --file backend/recover-cover-samples.sql
      - name: Verify both independently stored cover files
        run: |
          for attempt in {1..90}; do
            npx --yes wrangler@4.74.0 d1 execute DB --remote --config backend/wrangler.stage.generated.jsonc --command "SELECT substr(order_id,1,8) AS reference,status,error_code,generation_calls,sha256,bytes FROM order_theme_covers WHERE order_id IN ('a658793a-c546-452a-a5ee-74305eb4a5ee','dc1a8305-c29b-442c-86b2-79dea8f01704');" --json > "$RUNNER_TEMP/covers.json"
            result=$(node -e "const rows=require(process.env.RUNNER_TEMP+'/covers.json')[0]?.results||[];console.log(rows.some(r=>r.status==='failed')?'failed':rows.length===2&&rows.every(r=>r.status==='ready'&&r.generation_calls===1&&r.bytes>0)&&new Set(rows.map(r=>r.sha256)).size===2?'ready':'pending')")
            if [ "$result" = ready ]; then echo 'Both distinct theme covers stored and verified; one image call each'; exit 0; fi
            if [ "$result" = failed ]; then node -e "for(const r of require(process.env.RUNNER_TEMP+'/covers.json')[0].results)console.log(r.reference,r.status,r.error_code||'none',r.generation_calls)"; exit 1; fi
            sleep 10
          done
          echo '::error::The cover check did not complete; no further image submission is authorized'; exit 1
