name: Verify and activate uploaded retail game packs
on:
  push:
    branches: [frontend-prd-v13-2026-10-08]
    paths: [backend/repair-retail.trigger]
permissions:
  contents: read
  actions: read
concurrency:
  group: retail-game-release
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      REUSE_RETAIL_UPLOADS: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: retail-game-packs
          run-id: 38051192310
          github-token: ${{ github.token }}
          path: output/pdf
      - run: node scripts/release_retail_packs.mjs
