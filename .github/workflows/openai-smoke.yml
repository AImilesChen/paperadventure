name: Private OpenAI story-to-PDF smoke

on:
  push:
    branches:
      - frontend-prd-v13-2026-10-08
    paths:
      - backend/openai-smoke.trigger

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:backend
      - name: Require private OpenAI key
        run: test -n "$OPENAI_API_KEY"
      - name: Generate Home and Classroom PDFs with real model
        run: node scripts/openai-smoke.mjs
