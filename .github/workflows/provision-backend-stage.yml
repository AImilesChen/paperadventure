name: Provision isolated backend stage

on:
  push:
    branches:
      - frontend-prd-v13-2026-10-08
    paths:
      - backend/stage-provision.trigger

permissions:
  contents: read

concurrency:
  group: paper-adventure-backend-stage
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"
      CLOUDFLARE_ACCOUNT_ID: "77bc392d46985cd3425691358f5e8a77"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:backend
      - name: Check Cloudflare token
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Check existing Worker DeepSeek secret names
        run: |
          for worker in paper-adventure-api-stage paper-adventure-preview-v2; do
            if npx --yes wrangler@4.74.0 secret list --name "$worker" --format json > "$RUNNER_TEMP/$worker-secrets.json" 2> "$RUNNER_TEMP/$worker-secrets.err"; then
              WORKER="$worker" node -e "const fs=require('node:fs'); const rows=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+process.env.WORKER+'-secrets.json','utf8')); const names=Array.isArray(rows)?rows.map(x=>x.name).filter(x=>/deepseek/i.test(x)):[]; console.log(process.env.WORKER+' DeepSeek secret names: '+(names.join(', ')||'none'))"
            else
              echo "$worker secret-name check unavailable"
            fi
          done
      - name: Create or reuse isolated D1, R2 and Queue resources
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@4.74.0 d1 info paper-adventure-stage-db --json > "$RUNNER_TEMP/paw-d1.json" 2> "$RUNNER_TEMP/paw-d1.err"; then
            npx --yes wrangler@4.74.0 d1 create paper-adventure-stage-db
            npx --yes wrangler@4.74.0 d1 info paper-adventure-stage-db --json > "$RUNNER_TEMP/paw-d1.json"
          fi
          if ! npx --yes wrangler@4.74.0 r2 bucket info paper-adventure-stage-private --json > "$RUNNER_TEMP/paw-r2.json" 2> "$RUNNER_TEMP/paw-r2.err"; then
            npx --yes wrangler@4.74.0 r2 bucket create paper-adventure-stage-private
          fi
          if ! npx --yes wrangler@4.74.0 queues info paper-adventure-stage-generation > "$RUNNER_TEMP/paw-queue.txt" 2> "$RUNNER_TEMP/paw-queue.err"; then
            npx --yes wrangler@4.74.0 queues create paper-adventure-stage-generation
          fi
          node -e "const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/paw-d1.json','utf8')); const id=d.uuid||d.result?.uuid||d.database?.uuid; if(!/^[0-9a-f-]{36}$/i.test(id||'')) throw Error('D1 UUID missing'); fs.appendFileSync(process.env.GITHUB_ENV,'PAPER_ADVENTURE_STAGE_D1_ID='+id+'\\n')"
      - name: Create isolated adult-session signing secret if absent
        run: |
          npx --yes wrangler@4.74.0 secret list --name paper-adventure-api-stage --format json > "$RUNNER_TEMP/paw-stage-secrets.json"
          if node -e "const fs=require('node:fs'); const rows=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/paw-stage-secrets.json','utf8')); process.exit(rows.some(item=>item.name==='SESSION_SECRET')?0:1)"; then
            echo "Stage session signing secret already exists"
          else
            openssl rand -hex 32 | npx --yes wrangler@4.74.0 secret put SESSION_SECRET --name paper-adventure-api-stage
          fi
      - name: Apply stage schema and deploy unindexed backend Worker
        run: |
          node scripts/write-stage-wrangler.mjs
          npx --yes wrangler@4.74.0 d1 migrations apply DB --remote --config backend/wrangler.stage.generated.jsonc
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --file backend/release-celebration-trial.sql --yes
          npx --yes wrangler@4.74.0 deploy --config backend/wrangler.stage.generated.jsonc
      - name: Verify cloud API and test-only release flags
        run: |
          curl --fail --silent --show-error https://paper-adventure-api-stage.chenminjian08.workers.dev/api/v1/health | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const v=JSON.parse(s);if(v.status!=='configured_runtime'||(v.checkout&&v.checkoutMode!=='test')||!v.generation||!v.proposals||!v.account||!v.sample||v.legal)throw Error('Stage capability mismatch: '+s);console.log('Stage API healthy; free sample, Google account and signed-in AI previews live; checkout test-only')})"
          verified=false
          for attempt in {1..12}; do
            if curl --fail --silent --show-error https://paper-adventure-api-stage.chenminjian08.workers.dev/api/v1/catalog | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const v=JSON.parse(s);const c=v.themes?.find(t=>t.id==='celebration');if(v.freeSampleThemeId!=='celebration'||!c?.home?.freeSample||!c?.classroom?.freeSample||v.themes?.some(t=>t.id!=='celebration'&&[t.home,t.classroom].some(p=>p?.readyStatus==='published'||p?.freeSample)))throw Error('Test catalog mismatch: '+JSON.stringify({freeSampleThemeId:v.freeSampleThemeId,home:c?.home?.freeSample,classroom:c?.classroom?.freeSample}));console.log('Celebration free; other themes remain test-only')})"; then
              verified=true
              break
            fi
            sleep 2
          done
          test "$verified" = true
          curl --fail --silent --show-error https://paper-adventure-api-stage.chenminjian08.workers.dev/robots.txt | grep -Fq 'Disallow: /'
          node scripts/verify-celebration-release.mjs
          node scripts/verify-google-signin-ready.mjs
          curl --fail --silent --show-error --output "$RUNNER_TEMP/paw-dinosaur-p2.jpg" https://paperadventure.app/api/v1/test-pack-previews/dinosaur/home/2
          node -e "const b=require('node:fs').readFileSync(process.env.RUNNER_TEMP+'/paw-dinosaur-p2.jpg');if(b.length<10000||b[0]!==255||b[1]!==216)throw Error('Opening player activity preview is missing or invalid');console.log('Actual opening Player Pack page is publicly previewable')"
          curl --fail --silent --show-error https://paper-adventure-api-stage.chenminjian08.workers.dev/api/v1/catalog | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const v=JSON.parse(s),ids=['ocean','museum','library','weather','workshop'];if(v.themes.filter(t=>t.availableSettings?.includes('home')).length!==6||v.themes.filter(t=>t.availableSettings?.includes('classroom')).length!==6||ids.some(id=>v.themes.find(t=>t.id===id)?.classroom?.readyStatus!=='test_ready')||['dinosaur','space','forest','halloween','christmas'].some(id=>v.themes.find(t=>t.id===id)?.classroom?.readyStatus!=='not_offered'))throw Error('Distinct world catalog mismatch');console.log('Six Home and six Classroom games; five new Classroom packs test-ready, old Classroom orders archived')})"
          curl --fail --silent --show-error --output "$RUNNER_TEMP/paw-ocean-p2.jpg" https://paperadventure.app/api/v1/test-pack-previews/ocean/classroom/2
          node -e "const b=require('node:fs').readFileSync(process.env.RUNNER_TEMP+'/paw-ocean-p2.jpg');if(b.length<10000||b[0]!==255||b[1]!==216)throw Error('New Classroom opening preview is invalid');console.log('Ocean Classroom preview is accessible')"
      - name: Check restricted adult sign-in delivery to project support inbox
        run: |
          curl --fail --silent --show-error --request POST \
            --header 'Origin: https://paperadventure.app' \
            --header 'Content-Type: application/json' \
            --data '{"email":"support@paperadventure.app"}' \
            https://paper-adventure-api-stage.chenminjian08.workers.dev/api/v1/access-links |
            node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{if(JSON.parse(s).sent!==true)throw Error('Restricted email send did not succeed');console.log('Restricted sign-in send accepted')})"


