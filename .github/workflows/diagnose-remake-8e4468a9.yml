name: Diagnose remake line for order 8E4468A9
on:
  push:
    branches: [diagnose-remake-8e4468a9]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read remake line state safely
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT status,phase,error_code,recovery_round,logic_epoch,quality_epoch,published_version,json_extract(spec_json,'$.packQualityVersion') AS pack_qv,json_extract(spec_json,'$.packExperienceVersion') AS pack_ev,json_extract(spec_json,'$.packCausalVersion') AS pack_cv FROM custom_pack_remakes WHERE order_id='8e4468a9-9847-43ae-b1b7-20e05c32f807'" > "$RUNNER_TEMP/remake.json"
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT phase,stage_number,status,error_code,generation_round,logic_epoch,quality_epoch FROM custom_pack_remake_calls WHERE order_id='8e4468a9-9847-43ae-b1b7-20e05c32f807' ORDER BY created_at,id" > "$RUNNER_TEMP/calls.json"
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT phase,status,error_code,generation_round,error_detail FROM custom_pack_remake_calls WHERE order_id='8e4468a9-9847-43ae-b1b7-20e05c32f807' AND status='failed' ORDER BY created_at DESC,id DESC LIMIT 3" > "$RUNNER_TEMP/failed.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const rows=p=>{const d=JSON.parse(fs.readFileSync(p,'utf8'));return Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[]};
          const classify=v=>{const s=String(v||'').toLowerCase();
            if(/ordering material needs four natural|order tiles need|worksheet instruction/i.test(s))return 'ORDER_TILE_LABELS';
            if(/record fact|two concrete|two printed/i.test(s))return 'RECORD_FACTS';
            if(/repeats a printed action/i.test(s))return 'ORDER_TILE_REPEAT';
            if(/story link|discover|consequence|finding|supports/i.test(s))return 'STORY_LINK';
            if(/closing|ending|celebration|outcome/i.test(s))return 'CLOSING';
            if(/blueprint/i.test(s))return 'BLUEPRINT_GENERIC';
            return 'OTHER';};
          console.log('REMAKE_ROW', JSON.stringify(rows(process.env.RUNNER_TEMP+'/remake.json')));
          console.log('CALLS', JSON.stringify(rows(process.env.RUNNER_TEMP+'/calls.json').map(r=>({phase:r.phase,stage:r.stage_number,status:r.status,code:r.error_code,round:r.generation_round,logic:r.logic_epoch,qe:r.quality_epoch}))));
          console.log('FAILED', JSON.stringify(rows(process.env.RUNNER_TEMP+'/failed.json').map(r=>({phase:r.phase,stage:r.stage_number,code:r.error_code,round:r.generation_round,cat:classify(r.error_detail)}))));
          NODE
