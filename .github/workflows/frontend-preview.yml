name: Frontend preview checks

on:
  pull_request:
  push:
    branches:
      - frontend-prd-v13-2026-10-08

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Inspect saved paid-game quality evidence
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAPER_ADVENTURE_STAGE_D1_ID: 'b7d51f25-4c7f-4e51-84e5-52459376e9f9'
        run: |
          node scripts/write-stage-wrangler.mjs
          npx --yes wrangler@4.74.0 d1 execute DB --remote --config backend/wrangler.stage.generated.jsonc --command "SELECT status,phase,error_code,error_detail,recovery_round,json_array_length(stages_json) AS saved_stages,CASE WHEN story_json IS NULL THEN 0 ELSE 1 END AS story_ready,published_version FROM custom_pack_remakes WHERE order_id='612a56bd-494a-4265-984f-f4ecb3eb7407'"
          npx --yes wrangler@4.74.0 d1 execute DB --remote --config backend/wrangler.stage.generated.jsonc --command "SELECT json_extract(value,'$.number') AS stage,json_extract(value,'$.mechanic') AS mechanic,json_extract(value,'$.clue') AS clue,json_extract(value,'$.material.type') AS material,json_extract(value,'$.material.instruction') AS paper_action,json_extract(value,'$.material.items') AS paper_pieces,json_extract(value,'$.options') AS choices,json_extract(value,'$.answerIndex') AS answer,json_extract(value,'$.explanation') AS explanation FROM custom_pack_remakes,json_each(custom_pack_remakes.stages_json) WHERE order_id='612a56bd-494a-4265-984f-f4ecb3eb7407'"
      - run: npm ci
      - run: npm run build
      - run: npm run test:static
      - run: npm run test:sites
      - run: npm run test:backend
      - name: Bundle production API without publishing
        run: npx --yes wrangler@4.74.0 deploy --config backend/wrangler.production-smoke.jsonc --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: paper-adventure-preview-${{ github.sha }}
          path: dist/client/
          if-no-files-found: error
          retention-days: 7
