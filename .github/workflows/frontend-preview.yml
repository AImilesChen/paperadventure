name: Frontend preview checks

on:
  pull_request:
  push:
    branches:
      - frontend-prd-v13-2026-10-08

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:static
      - run: npm run test:sites
      - run: npm run test:backend
      - uses: actions/upload-artifact@v7
        with:
          name: paper-adventure-preview-${{ github.sha }}
          path: dist/client/
          if-no-files-found: error
          retention-days: 7
