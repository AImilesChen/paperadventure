name: Classify order 8E4468A9 evidence fields safely
on:
  push:
    branches: [diagnose-order-8e4468a9-evidence]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ORDER_ID: '8e4468a9-9847-43ae-b1b7-20e05c32f807'
    steps:
      - name: Return field-presence booleans only
        shell: bash
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "WITH a AS (
            SELECT c.normalized_json,
              json_extract(j.value,'$.quote') quote,
              lower(json_extract(j.value,'$.reason')) reason
            FROM custom_delivery_copy c, json_each(json_extract(c.audit_json,'$.issues')) j
            WHERE c.order_id='${ORDER_ID}' AND c.policy='printed-causal-copy-1'
            LIMIT 1
          ), s AS (
            SELECT stage_json FROM custom_game_stages WHERE order_id='${ORDER_ID}' AND stage_number=5
          )
          SELECT
            instr(coalesce(json_extract(s.stage_json,'$.storyContext'),''),coalesce(a.quote,'_NO_QUOTE_'))>0 original_scene_quote,
            instr(coalesce(json_extract(a.normalized_json,'$.stages[4].scene'),''),coalesce(a.quote,'_NO_QUOTE_'))>0 rewritten_scene_quote,
            EXISTS(SELECT 1 FROM json_each(json_extract(a.normalized_json,'$.actions')) x WHERE instr(coalesce(json_extract(x.value,'$.description'),''),coalesce(a.quote,'_NO_QUOTE_'))>0 OR instr(coalesce(json_extract(x.value,'$.label'),''),coalesce(a.quote,'_NO_QUOTE_'))>0) action_quote,
            instr(coalesce(json_extract(a.normalized_json,'$.celebration'),''),coalesce(a.quote,'_NO_QUOTE_'))>0 closing_quote,
            instr(a.reason,'location')>0 reason_location,
            instr(a.reason,'route')>0 reason_route,
            instr(a.reason,'destination')>0 reason_destination,
            instr(a.reason,'recipient')>0 reason_recipient,
            instr(a.reason,'already')>0 reason_already,
            instr(a.reason,'before')>0 reason_before,
            instr(a.reason,'after')>0 reason_after,
            instr(a.reason,'action')>0 reason_action,
            instr(a.reason,'scene')>0 reason_scene
          FROM a CROSS JOIN s" > "$RUNNER_TEMP/audit-source.json"
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT
            json_extract(j.value,'$.stageNumber') stage_number,
            json_extract(j.value,'$.code') issue_code
          FROM custom_delivery_copy c, json_each(json_extract(c.audit_json,'$.issues')) j
          WHERE c.order_id='${ORDER_ID}' AND c.policy='printed-causal-copy-1'" > "$RUNNER_TEMP/audit.json"
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "WITH c AS (
            SELECT lower(trim(rtrim(substr(error_detail,instr(lower(error_detail),'player material: ')+length('player material: ')),'.'))) missing
            FROM custom_delivery_copy WHERE order_id='${ORDER_ID}' AND policy='printed-causal-copy-1'
          )
          SELECT s.stage_number,
            instr(lower(coalesce(json_extract(s.stage_json,'$.storyContext'),'')),c.missing)>0 story_context,
            instr(lower(coalesce(json_extract(s.stage_json,'$.clue'),'')),c.missing)>0 clue,
            instr(lower(coalesce(json_extract(s.stage_json,'$.task'),'')),c.missing)>0 task,
            instr(lower(coalesce(json_extract(s.stage_json,'$.hint'),'')),c.missing)>0 hint,
            instr(lower(coalesce(json_extract(s.stage_json,'$.explanation'),'')),c.missing)>0 explanation,
            instr(lower(coalesce(json_extract(s.stage_json,'$.material.instruction'),'')),c.missing)>0 instruction,
            EXISTS(SELECT 1 FROM json_each(json_extract(s.stage_json,'$.options')) x WHERE instr(lower(coalesce(x.value,'')),c.missing)>0) options,
            EXISTS(SELECT 1 FROM json_each(json_extract(s.stage_json,'$.material.items')) x WHERE instr(lower(coalesce(json_extract(x.value,'$.label'),'')),c.missing)>0) item_label,
            EXISTS(SELECT 1 FROM json_each(json_extract(s.stage_json,'$.material.items')) x WHERE instr(lower(coalesce(json_extract(x.value,'$.detail'),'')),c.missing)>0) item_detail,
            instr(lower(coalesce(json_extract(s.stage_json,'$.material.logic'),'')),c.missing)>0 logic
          FROM custom_game_stages s CROSS JOIN c
          WHERE s.order_id='${ORDER_ID}' ORDER BY s.stage_number" > "$RUNNER_TEMP/fields.json"
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "WITH c AS (
            SELECT lower(trim(rtrim(substr(error_detail,instr(lower(error_detail),'player material: ')+length('player material: ')),'.'))) missing,
              normalized_json
            FROM custom_delivery_copy WHERE order_id='${ORDER_ID}' AND policy='printed-causal-copy-1'
          )
          SELECT
            instr(lower(coalesce(json_extract(normalized_json,'$.stages[4].scene'),'')),missing)>0 final_scene,
            instr(lower(coalesce(json_extract(normalized_json,'$.links.checkpoint_1.reason'),'')),missing)>0 link_1,
            instr(lower(coalesce(json_extract(normalized_json,'$.links.checkpoint_2.reason'),'')),missing)>0 link_2,
            instr(lower(coalesce(json_extract(normalized_json,'$.links.checkpoint_3.reason'),'')),missing)>0 link_3,
            instr(lower(coalesce(json_extract(normalized_json,'$.links.checkpoint_4.reason'),'')),missing)>0 link_4
          FROM c" > "$RUNNER_TEMP/final.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/fields.json','utf8'));
          const rows=(Array.isArray(data)?data:[data]).flatMap(x=>x.results||[]);
          if(rows.length!==5)throw Error('Expected five saved stages');
          const finalData=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/final.json','utf8'));
          const finalRows=(Array.isArray(finalData)?finalData:[finalData]).flatMap(x=>x.results||[]);
          const auditData=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/audit.json','utf8'));
          const auditRows=(Array.isArray(auditData)?auditData:[auditData]).flatMap(x=>x.results||[]);
          const sourceData=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/audit-source.json','utf8'));
          const sourceRows=(Array.isArray(sourceData)?sourceData:[sourceData]).flatMap(x=>x.results||[]);
          console.log(JSON.stringify({saved_fields:rows,normalized_fields:finalRows[0]||null,audit_issues:auditRows,audit_source:sourceRows[0]||null}));
          NODE
