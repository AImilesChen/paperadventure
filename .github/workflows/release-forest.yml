name: Release Forest Home experience
on:
  push:
    branches: [frontend-prd-v13-2026-10-08]
    paths: [backend/release-forest.trigger]
permissions:
  contents: read
concurrency:
  group: retail-game-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      RETAIL_SCOPE: 'forest/home'
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_CLI: 'node_modules/wrangler/bin/wrangler.js'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install reportlab pypdf pdfplumber pillow
      - run: npm install --no-save --package-lock=false wrangler@4.74.0
      - name: Install PDF renderer
        run: |
          choco install poppler -y --no-progress
          $renderer = Get-ChildItem -LiteralPath 'C:/ProgramData/chocolatey/lib/poppler' -Filter pdftoppm.exe -Recurse | Select-Object -First 1
          if (!$renderer) { throw 'PDF renderer missing' }
          $renderer.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - run: python scripts/generate_retail_packs.py
      - run: python scripts/check_retail_packs.py
      - run: python scripts/check_forest_experience.py
      - run: python scripts/build_retail_previews.py
      - run: node scripts/release_retail_packs.mjs
