name: Deploy creator API preferences
on:
  push:
    branches: [frontend-prd-v13-2026-10-08]
    paths: [backend/creator-deploy.trigger]
permissions:
  contents: read
concurrency:
  group: paper-adventure-backend-stage
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PAYMENTS_EXPECTED_MODE: live
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:backend
      - run: npm run test:release
      - name: Read existing database identifier
        run: |
          npx --yes wrangler@4.74.0 d1 info paper-adventure-stage-db --json > "$RUNNER_TEMP/paw-d1.json"
          node -e "const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/paw-d1.json','utf8')); const id=d.uuid||d.result?.uuid||d.database?.uuid; if(!/^[0-9a-f-]{36}$/i.test(id||'')) throw Error('D1 UUID missing'); fs.appendFileSync(process.env.GITHUB_ENV,'PAPER_ADVENTURE_STAGE_D1_ID='+id+'\n')"
      - name: Deploy API without changing configured variables or secrets
        run: |
          node scripts/write-stage-wrangler.mjs
          npx --yes wrangler@4.74.0 d1 migrations apply DB --remote --config backend/wrangler.stage.generated.jsonc
          npx --yes wrangler@4.74.0 deploy --config backend/wrangler.stage.generated.jsonc --keep-vars --var OWNER_PAYMENT_COUPON_SETUP:v1
      - name: Verify historical test exception cleanup (aggregate counts only)
        run: |
          npx --yes wrangler@4.74.0 d1 execute DB --remote --config backend/wrangler.stage.generated.jsonc --command "SELECT COUNT(*) AS archived_test_orders, SUM(CASE WHEN o.payment_mode!='test' THEN 1 ELSE 0 END) AS non_test_archived, SUM(CASE WHEN o.cover_status='failed' AND o.status!='refunded' THEN 1 ELSE 0 END) AS cleared_cover_alerts, SUM(CASE WHEN o.paid_at IS NOT NULL AND o.status!='refunded' AND (o.status='failed' OR o.plan_status='needs_help') THEN 1 ELSE 0 END) AS cleared_delivery_alerts, SUM(CASE WHEN o.plan_status='review' AND o.status!='refunded' THEN 1 ELSE 0 END) AS cleared_waiting_plans FROM admin_exception_archives a JOIN admin_order_ledger o ON o.id=a.order_id WHERE a.cleanup_ref='historical-tests-20261025' AND a.restored_at IS NULL" --json
      - name: Verify configured runtime
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error https://paperadventure.app/api/v1/health > "$RUNNER_TEMP/paw-health.json" &&
              node scripts/payment-runtime.mjs < "$RUNNER_TEMP/paw-health.json" &&
              node -e "const v=require(process.env.RUNNER_TEMP+'/paw-health.json');if(!v.generation||v.proposals!==false||!v.paidPlanReview||!v.account)throw Error('Paid creator runtime capabilities do not match the release');console.log('Paid creator runtime ready')"; then exit 0; fi
            sleep 5
          done
          exit 1




      - name: Verify owner coupon setup without exposing credentials or creating a checkout
        run: |
          for attempt in {1..40}; do
            npx --yes wrangler@4.74.0 d1 execute DB --remote --config backend/wrangler.stage.generated.jsonc --command "SELECT status,setup_attempts,error_code FROM checkout_promotions WHERE id='owner-live-check-20261025';" --json > "$RUNNER_TEMP/owner-coupon-status.json"
            result=$(node -e "const d=require(process.env.RUNNER_TEMP+'/owner-coupon-status.json');console.log(d[0]?.results?.[0]?.status||'pending')")
            if [ "$result" = ready ]; then echo 'Owner one-use $8.99 coupon is ready; no payment attempted'; exit 0; fi
            if [ "$result" != pending ]; then cat "$RUNNER_TEMP/owner-coupon-status.json"; echo 'Coupon requires operator follow-up; live checkout remains unchanged'; exit 0; fi
            sleep 10
          done
          echo 'Coupon setup remains pending; no payment attempted'
