name: Inspect one paid remake recovery 2
on:
  push:
    branches: [frontend-prd-v13-2026-10-08]
    paths: [.github/workflows/inspect-paid-remake-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAPER_ADVENTURE_STAGE_D1_ID: 'b7d51f25-4c7f-4e51-84e5-52459376e9f9'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/write-stage-wrangler.mjs
      - name: Read safe recovery status and stage counts
        run: |
          npx --yes wrangler@4.74.0 d1 execute DB --remote --config backend/wrangler.stage.generated.jsonc --command "SELECT status,phase,error_code,recovery_count,json_array_length(stages_json) AS saved_stages,CASE WHEN blueprint_json IS NULL THEN 0 ELSE 1 END AS blueprint_ready,CASE WHEN story_json IS NULL THEN 0 ELSE 1 END AS story_ready,published_version FROM custom_pack_remakes WHERE order_id='612a56bd-494a-4265-984f-f4ecb3eb7407'"
          npx --yes wrangler@4.74.0 d1 execute DB --remote --config backend/wrangler.stage.generated.jsonc --command "SELECT round_number,phase,stage_number,status,error_code,COUNT(*) AS calls FROM custom_pack_remake_calls WHERE order_id='612a56bd-494a-4265-984f-f4ecb3eb7407' GROUP BY round_number,phase,stage_number,status,error_code ORDER BY round_number,phase,stage_number"

