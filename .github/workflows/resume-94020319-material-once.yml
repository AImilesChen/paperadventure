name: Resume order 94020319 repeated material once
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Grant exactly one call to the failed second material step
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --command "
            INSERT OR IGNORE INTO custom_generation_recovery_grants
              (order_id,phase,stage_number,extra_calls,reason_code)
            SELECT o.id,'blueprint_material',2,1,'REPEATED_ORDER_ACTION'
            FROM orders o
            JOIN custom_activities a ON a.order_id=o.id
            JOIN custom_plan_orders p ON p.order_id=o.id
            WHERE o.id='94020319-5590-4fec-8e79-ce429912be3e'
              AND o.status='failed' AND o.paid_at IS NOT NULL
              AND a.status='failed' AND p.confirmed_version IS NOT NULL
              AND NOT EXISTS (SELECT 1 FROM custom_game_blueprints b WHERE b.order_id=o.id)
              AND NOT EXISTS (SELECT 1 FROM artifact_versions v WHERE v.custom_activity_id=a.id AND v.status='published')
              AND EXISTS (SELECT 1 FROM custom_generation_calls c WHERE c.order_id=o.id AND c.phase='blueprint_frame' AND c.status='passed')
              AND EXISTS (SELECT 1 FROM custom_generation_calls c WHERE c.order_id=o.id AND c.phase='blueprint_material' AND c.stage_number=1 AND c.status='passed')
              AND (SELECT COUNT(*) FROM custom_generation_calls c WHERE c.order_id=o.id AND c.phase='blueprint_material' AND c.stage_number=2)=2
              AND (SELECT COUNT(*) FROM custom_generation_calls c WHERE c.order_id=o.id AND c.phase='blueprint_material' AND c.stage_number=2 AND c.status='failed' AND c.error_code='BLUEPRINT_INVALID' AND c.error_detail LIKE '%repeats a printed action from an earlier checkpoint%')=2
              AND EXISTS (SELECT 1 FROM custom_generation_calls c WHERE c.order_id=o.id AND c.phase='blueprint_material' AND c.stage_number=2 AND c.status='failed' AND c.result_json IS NOT NULL);
          "
      - name: Requeue only the same stopped paid activity
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --command "
            UPDATE custom_activities
            SET status='queued',lease_until=NULL,pipeline_failures=0
            WHERE order_id='94020319-5590-4fec-8e79-ce429912be3e'
              AND status='failed'
              AND EXISTS (SELECT 1 FROM custom_generation_recovery_grants g WHERE g.order_id=custom_activities.order_id AND g.phase='blueprint_material' AND g.stage_number=2 AND g.extra_calls=1)
              AND (SELECT COUNT(*) FROM custom_generation_calls c WHERE c.order_id=custom_activities.order_id AND c.phase='blueprint_material' AND c.stage_number=2)=2;
          "
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --command "
            UPDATE orders SET status='fulfilling'
            WHERE id='94020319-5590-4fec-8e79-ce429912be3e'
              AND status='failed' AND paid_at IS NOT NULL
              AND EXISTS (SELECT 1 FROM custom_activities a WHERE a.order_id=orders.id AND a.status='queued')
              AND EXISTS (SELECT 1 FROM custom_generation_recovery_grants g WHERE g.order_id=orders.id AND g.phase='blueprint_material' AND g.stage_number=2 AND g.extra_calls=1)
              AND (SELECT COUNT(*) FROM custom_generation_calls c WHERE c.order_id=orders.id AND c.phase='blueprint_material' AND c.stage_number=2)=2;
          "
      - name: Verify only safe recovery state
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "
            SELECT o.status AS order_status,a.status AS activity_status,
              (SELECT COUNT(*) FROM custom_generation_recovery_grants g WHERE g.order_id=o.id AND g.phase='blueprint_material' AND g.stage_number=2) AS grant_count,
              (SELECT COUNT(*) FROM custom_generation_calls c WHERE c.order_id=o.id AND c.phase='blueprint_material' AND c.stage_number=2) AS stage2_calls
            FROM orders o JOIN custom_activities a ON a.order_id=o.id
            WHERE o.id='94020319-5590-4fec-8e79-ce429912be3e';
          " > "$RUNNER_TEMP/recovery-state.json"
          node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/recovery-state.json','utf8'));const r=(Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[])[0];if(!r||r.order_status!=='fulfilling'||r.activity_status!=='queued'||Number(r.grant_count)!==1||Number(r.stage2_calls)!==2)throw Error('Scoped recovery preconditions did not hold');console.log(JSON.stringify(r))"
