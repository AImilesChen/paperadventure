name: Release paid Midnight Masquerade edition
on:
  push:
    branches: [frontend-prd-v13-2026-10-08]
    paths: [backend/release-midnight-masquerade.trigger]
permissions:
  contents: read
concurrency:
  group: paper-adventure-backend-stage
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm run test:backend
      - run: npm run test:release
      - run: node --test tests/midnight-product.test.mjs
      - run: node --test games/midnight-masquerade/model.test.mjs
      - run: python -m pip install reportlab pypdf
      - run: node games/midnight-masquerade/build.mjs
      - run: python games/midnight-masquerade/build_pdfs.py
      - run: python games/midnight-masquerade/package.py
      - run: npm install --no-save --package-lock=false wrangler@4.149.0
      - name: Upload and verify fourteen private artifacts, then publish only the new edition
        run: node scripts/release_midnight_pack.mjs
      - name: Read existing database identifier
        run: |
          node node_modules/wrangler/bin/wrangler.js d1 info paper-adventure-stage-db --json > "$RUNNER_TEMP/paw-d1.json"
          node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/paw-d1.json'));const id=d.uuid||d.result?.uuid||d.database?.uuid;if(!/^[0-9a-f-]{36}$/i.test(id||''))throw Error('Database identifier missing');fs.appendFileSync(process.env.GITHUB_ENV,'PAPER_ADVENTURE_STAGE_D1_ID='+id+'\n')"
      - name: Deploy verified API preserving configured secrets and variables
        run: |
          node scripts/write-stage-wrangler.mjs
          node node_modules/wrangler/bin/wrangler.js deploy --config backend/wrangler.stage.generated.jsonc --keep-vars
      - name: Verify product availability and anonymous denial without creating a checkout
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          let ready=false;
          for(let i=0;i<30;i++){
            try{const c=await(await fetch('https://paperadventure.app/api/v1/catalog')).json();const p=c.escapeGames?.find(p=>p.id==='midnight-masquerade');assert.equal(p?.home?.readyStatus,'published');assert.equal(p.home.packVersion,'v2.0');const offer=c.offers.find(o=>o.sku==='ready_home');assert.equal(offer.unitAmount,999);assert.equal(offer.saleEnabled,true);ready=true;break;}catch{await new Promise(r=>setTimeout(r,3000));}
          }
          assert.ok(ready,'New product is not available');
          for(const role of ['bundle','companion',...['A4','Letter'].flatMap(p=>['setup','role-A','role-B','role-C'].map(r=>p+'-'+r+'.pdf'))]){const r=await fetch('https://paperadventure.app/api/v1/orders/nonexistent/escape/'+role);assert.equal(r.status,401);assert.match(r.headers.get('content-type'),/json/);}
          console.log('Paid product available at USD9.99; unauthenticated bundle and companion denied. No checkout, charge, mail or generation executed.');
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: midnight-masquerade-release-evidence
          path: output/private/midnight-release-evidence.json
          if-no-files-found: ignore

