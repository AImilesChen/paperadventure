name: Read story frame discoveries
on:
  push:
    branches: [diagnose-frame-8e4468a9]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Read story frame
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT result_json FROM custom_pack_remake_calls WHERE order_id='8e4468a9-9847-43ae-b1b7-20e05c32f807' AND phase='blueprint_frame' AND status='passed' ORDER BY created_at DESC,id DESC LIMIT 1" > "$RUNNER_TEMP/frame.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/frame.json','utf8'));
          const rows=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];
          const f=JSON.parse(rows[0].result_json);
          console.log('ACTIONS', JSON.stringify(f.actions));
          console.log('DISCOVERIES', JSON.stringify(f.discoveries.map(x=>({finding:x.finding,supportsAction:x.supportsAction,consequence:x.consequence}))));
          NODE
