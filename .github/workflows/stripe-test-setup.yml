name: Activate Stripe sandbox checkout

on:
  workflow_dispatch:
  push:
    branches:
      - frontend-prd-v13-2026-10-08
    paths:
      - backend/stripe-test-setup.trigger

permissions:
  contents: read

concurrency:
  group: paper-adventure-backend-stage
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
      CLOUDFLARE_ACCOUNT_ID: "77bc392d46985cd3425691358f5e8a77"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
      STRIPE_TEST_BUYER_EMAIL: ${{ secrets.STRIPE_TEST_BUYER_EMAIL }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:backend
      - name: Confirm required sandbox settings before any mutation
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          case "$STRIPE_TEST_SECRET_KEY" in sk_test_*) ;; *) echo "::error::STRIPE_TEST_SECRET_KEY must be a Stripe test secret key"; exit 1;; esac
          case "$STRIPE_TEST_WEBHOOK_SECRET" in whsec_*) ;; *) echo "::error::STRIPE_TEST_WEBHOOK_SECRET must be the test webhook signing secret"; exit 1;; esac
          STRIPE_TEST_BUYER_EMAIL="$STRIPE_TEST_BUYER_EMAIL" node -e "const v=process.env.STRIPE_TEST_BUYER_EMAIL||'';if(!v.includes('@')||!v.includes('.'))throw Error('STRIPE_TEST_BUYER_EMAIL is required')"
      - name: Read existing stage database ID
        run: |
          npx --yes wrangler@4.74.0 d1 info paper-adventure-stage-db --json > "$RUNNER_TEMP/paw-d1.json"
          node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/paw-d1.json','utf8'));const id=d.uuid||d.result?.uuid||d.database?.uuid;if(!/^[0-9a-f-]{36}$/i.test(id||''))throw Error('Stage D1 UUID missing');fs.appendFileSync(process.env.GITHUB_ENV,'PAPER_ADVENTURE_STAGE_D1_ID='+id+'\\n')"
      - name: Configure the isolated Worker with test credentials
        run: |
          set -euo pipefail
          printf '%s' "$STRIPE_TEST_SECRET_KEY" | npx --yes wrangler@4.74.0 secret put STRIPE_SECRET_KEY --name paper-adventure-api-stage
          printf '%s' "$STRIPE_TEST_WEBHOOK_SECRET" | npx --yes wrangler@4.74.0 secret put STRIPE_WEBHOOK_SECRET --name paper-adventure-api-stage
          printf '%s' "$STRIPE_TEST_BUYER_EMAIL" | npx --yes wrangler@4.74.0 secret put STRIPE_TEST_BUYER_EMAIL --name paper-adventure-api-stage
      - name: Seed test-only prices and deploy
        run: |
          node scripts/write-stage-wrangler.mjs
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --file backend/test-checkout-prices.sql --yes
          npx --yes wrangler@4.74.0 deploy --config backend/wrangler.stage.generated.jsonc
      - name: Verify test checkout capability on the real domain
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error https://paperadventure.app/api/v1/health | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{const v=JSON.parse(s);if(v.status!=='configured_runtime'||v.checkout!==true||v.checkoutMode!=='test'||v.generation!==true||v.proposals!==true||v.legal!==false)throw Error('Stripe sandbox capability not ready');console.log('Stripe test checkout and AI generation ready; live payment and legal release remain off')})"; then exit 0; fi
            sleep 3
          done
          echo "::error::Stripe sandbox capability did not propagate"
          exit 1
