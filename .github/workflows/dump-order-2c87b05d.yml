name: Find artifacts
on:
  push:
    branches: [dump-order-2c87b05d]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Find
        run: |
          set +e
          OID='2c87b05d-6d55-406e-8985-d23e40f14793'
          W="npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command"
          $W "SELECT COUNT(*) AS total FROM artifact_versions" > "$RUNNER_TEMP/a.json"
          $W "SELECT custom_activity_id, version_number, status, created_at FROM artifact_versions ORDER BY created_at DESC LIMIT 8" > "$RUNNER_TEMP/b.json"
          $W "SELECT id, order_id, status, published_at FROM custom_activities WHERE order_id='$OID'" > "$RUNNER_TEMP/c.json"
          $W "SELECT name FROM sqlite_master WHERE type='table' AND name LIKE '%artifact%'" > "$RUNNER_TEMP/d.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const rd=f=>{try{const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+f,'utf8'));return Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];}catch(e){return [{ERR:e.message.slice(0,200)}];}};
          for(const [k,f] of [['TOTAL','a.json'],['ROWS','b.json'],['ACT','c.json'],['TABLES','d.json']]){
            const rows=rd(f); if(!rows.length)console.log(k,'<none>');
            for(const r of rows)console.log(k,JSON.stringify(r));
          }
          NODE
          true
