name: Dump copy candidate 2c87b05d
on:
  push:
    branches: [dump-order-2c87b05d]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Dump
        run: |
          set +e
          OID='2c87b05d-6d55-406e-8985-d23e40f14793'
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT normalized_json, candidate_json FROM custom_delivery_copy WHERE order_id='$OID'" > "$RUNNER_TEMP/a.json" 2>/dev/null
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/a.json','utf8'));
          const rows=(Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[]);
          const raw=rows[0]?.normalized_json||rows[0]?.candidate_json||'';
          console.log('COPY_LEN',raw.length);
          let c=null;try{c=JSON.parse(raw);}catch(e){console.log('PARSE_ERR',e.message);}
          if(c){
            console.log('KEYS',JSON.stringify(Object.keys(c)));
            console.log('CELEBRATION',JSON.stringify(c.celebration));
            const acts=c.actions||c.finalActions||[];
            for(const [i,a] of acts.entries())console.log('ACTION'+i,JSON.stringify(a));
            for(const [i,s] of (c.stages||[]).entries())console.log('STAGE'+(i+1),JSON.stringify(s));
            console.log('LINKS',JSON.stringify(c.links));
          }
          NODE
          true
