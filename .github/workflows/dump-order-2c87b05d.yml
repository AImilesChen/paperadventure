name: Dump audit issues 2c87b05d
on:
  push:
    branches: [dump-order-2c87b05d]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Dump
        run: |
          set +e
          OID='2c87b05d-6d55-406e-8985-d23e40f14793'
          W="npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command"
          $W "SELECT audit_json, substr(candidate_json,1,2500) AS cand FROM custom_delivery_copy WHERE order_id='$OID'" > "$RUNNER_TEMP/a.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/a.json','utf8'));
          const rows=(Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[]);
          const raw=rows[0]?.audit_json||'';
          console.log('AUDIT_LEN',raw.length);
          let a=null;try{a=JSON.parse(raw);}catch(e){console.log('PARSE_ERR',e.message);}
          if(a){
            console.log('AUDIT_KEYS',JSON.stringify(Object.keys(a)));
            console.log('PASS',a.pass,'ISSUE_COUNT',(a.issues||[]).length,'HAS_PROOF',Boolean(a.causalProof));
            for(const [i,x] of (a.issues||[]).entries())console.log('ISSUE'+i, JSON.stringify(x));
          }
          NODE
          true
