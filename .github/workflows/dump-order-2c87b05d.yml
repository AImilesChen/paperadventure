name: Check generation calls 2c87b05d
on:
  push:
    branches: [dump-order-2c87b05d]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check
        run: |
          set +e
          OID='2c87b05d-6d55-406e-8985-d23e40f14793'
          W="npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command"
          $W "SELECT phase, stage_number, status, model, input_tokens, output_tokens, error_code, substr(error_detail,1,300) AS detail, created_at, completed_at FROM custom_generation_calls WHERE order_id='$OID' ORDER BY created_at" > "$RUNNER_TEMP/a.json"
          $W "SELECT status, lease_until, delivery_retry_used, pipeline_failures FROM custom_activities WHERE order_id='$OID'" > "$RUNNER_TEMP/b.json"
          $W "SELECT datetime('now') AS now_utc, strftime('%s','now') AS epoch" > "$RUNNER_TEMP/c.json"
          $W "SELECT status, plan_confirmed_at FROM orders WHERE id='$OID'" > "$RUNNER_TEMP/d.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const rd=f=>{try{const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+f,'utf8'));return Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];}catch(e){return [{ERR:e.message.slice(0,150)}];}};
          for(const [k,f] of [['CALL','a.json'],['ACT','b.json'],['NOW','c.json'],['ORDER','d.json']]){
            const rows=rd(f); if(!rows.length)console.log(k,'<none>');
            for(const r of rows)console.log(k,JSON.stringify(r));
          }
          NODE
          true
