name: Check plan work 2c87b05d
on:
  push:
    branches: [dump-order-2c87b05d]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Dump plan work
        run: |
          set +e
          OID='2c87b05d-6d55-406e-8985-d23e40f14793'
          q() { npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "$2" > "$RUNNER_TEMP/$1.json" 2>"$RUNNER_TEMP/$1.err"; echo "Q $1 exit=$?"; }
          q work "SELECT phase, candidate_saved, plan_valid, audit_passed, provider_calls, error_code, updated_at FROM custom_plan_work WHERE order_id='$OID'"
          q req "SELECT kind, status, attempts, result_version, created_at, completed_at FROM custom_plan_requests WHERE order_id='$OID' ORDER BY created_at"
          q copies "SELECT policy, phase, calls, audit_passed, error_code, substr(error_detail,1,200) AS detail FROM custom_delivery_copy WHERE order_id='$OID'"
          q inc "SELECT phase, error_code, status, created_at FROM custom_delivery_incidents WHERE order_id='$OID'"
          node - <<'NODE'
          const fs=require('node:fs');
          const rd=f=>{try{const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+f+'.json','utf8'));return Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];}catch(e){return [{ERR:e.message.slice(0,150)}];}};
          for(const [k,f] of [['WORK','work'],['REQ','req'],['COPY','copies'],['INC','inc']]){
            const rows=rd(f);
            if(!rows.length) console.log(k,'<none>');
            for(const r of rows) console.log(k, JSON.stringify(r));
          }
          NODE
          true
