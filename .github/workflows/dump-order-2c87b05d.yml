name: Dump delivery copy failure 2c87b05d
on:
  push:
    branches: [dump-order-2c87b05d]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Dump
        run: |
          set +e
          OID='2c87b05d-6d55-406e-8985-d23e40f14793'
          W="npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command"
          $W "SELECT phase, calls, audit_passed, error_code, substr(error_detail,1,400) AS detail, length(candidate_json) AS cand_len, length(audit_json) AS audit_len, length(audit_response_json) AS audit_resp_len, length(repair_response_json) AS repair_len, input_tokens, output_tokens, updated_at FROM custom_delivery_copy WHERE order_id='$OID'" > "$RUNNER_TEMP/a.json"
          $W "SELECT phase, error_code, substr(error_detail,1,300) AS detail, audit_calls, substr(audit_json,1,600) AS audit FROM custom_delivery_copy_revisions WHERE order_id='$OID'" > "$RUNNER_TEMP/b.json"
          $W "SELECT phase, error_code, status, created_at FROM custom_delivery_incidents WHERE order_id='$OID'" > "$RUNNER_TEMP/c.json"
          $W "SELECT phase, error_code, status, input_tokens, output_tokens, substr(error_detail,1,200) AS detail, created_at FROM generation_usage WHERE order_id='$OID' ORDER BY attempt DESC LIMIT 6" > "$RUNNER_TEMP/d.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const rd=f=>{try{const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+f,'utf8'));return Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];}catch(e){return [{ERR:e.message.slice(0,150)}];}};
          for(const [k,f] of [['COPY','a.json'],['REV','b.json'],['INC','c.json'],['USAGE','d.json']]){
            const rows=rd(f); if(!rows.length)console.log(k,'<none>');
            for(const r of rows)console.log(k,JSON.stringify(r));
          }
          NODE
          true
