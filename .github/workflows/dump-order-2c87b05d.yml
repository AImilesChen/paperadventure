name: Dump frame discoveries 2c87b05d
on:
  push:
    branches: [dump-order-2c87b05d]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Dump
        run: |
          set +e
          OID='2c87b05d-6d55-406e-8985-d23e40f14793'
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT result_json FROM custom_generation_calls WHERE order_id='$OID' AND phase='blueprint_frame' AND status='passed' ORDER BY created_at DESC LIMIT 1" > "$RUNNER_TEMP/f.json" 2>/dev/null
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/f.json','utf8'));
          const rows=(Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[]);
          const raw=rows[0]?.result_json||'';
          console.log('FRAME_LEN',raw.length);
          let f=null;try{f=JSON.parse(raw);}catch(e){console.log('PARSE_ERR',e.message);}
          if(f){
            console.log('FRAME_KEYS',JSON.stringify(Object.keys(f)));
            console.log('PROBLEM',JSON.stringify(f.problem));
            console.log('ACTIONS',JSON.stringify(f.actions));
            for(const [i,x] of (f.discoveries||[]).entries())
              console.log('DISC'+(i+1), JSON.stringify(x), 'finding_len='+String(x?.finding||'').length, 'consequence_len='+String(x?.consequence||'').length);
          }
          NODE
          true
