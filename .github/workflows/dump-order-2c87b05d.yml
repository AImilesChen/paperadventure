name: Redo copy 2c87b05d
on:
  push:
    branches: [dump-order-2c87b05d]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Reset copy and requeue
        run: |
          set +e
          OID='2c87b05d-6d55-406e-8985-d23e40f14793'
          W="npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command"
          $W "UPDATE custom_delivery_copy SET calls=0, candidate_json=NULL, normalized_json=NULL, normalized_sha256=NULL, audit_json=NULL, audit_response_json=NULL, repair_response_json=NULL, audit_candidate_sha256=NULL, audit_passed=0, error_code=NULL, error_detail=NULL, input_tokens=0, output_tokens=0, phase='repair', updated_at=CURRENT_TIMESTAMP WHERE order_id='$OID'" > "$RUNNER_TEMP/u1.json"; echo "COPY=$?"
          $W "UPDATE custom_delivery_incidents SET status='resolved' WHERE order_id='$OID' AND status='open'" > "$RUNNER_TEMP/u2.json"; echo "INC=$?"
          $W "UPDATE custom_activities SET status='queued', lease_until=0, pipeline_failures=0 WHERE order_id='$OID'" > "$RUNNER_TEMP/u3.json"; echo "ACT=$?"
          $W "UPDATE orders SET status='fulfilling' WHERE id='$OID'" > "$RUNNER_TEMP/u4.json"; echo "ORD=$?"
          $W "SELECT calls, phase, candidate_json IS NULL AS no_cand, error_code FROM custom_delivery_copy WHERE order_id='$OID'" > "$RUNNER_TEMP/a.json"
          $W "SELECT c.status AS act, o.status AS ord FROM custom_activities c JOIN orders o ON o.id=c.order_id WHERE c.order_id='$OID'" > "$RUNNER_TEMP/b.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const rd=f=>{try{const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+f,'utf8'));return Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];}catch(e){return [{ERR:e.message.slice(0,150)}];}};
          for(const [k,f] of [['COPY','a.json'],['STATE','b.json']]){
            const rows=rd(f); if(!rows.length)console.log(k,'<none>');
            for(const r of rows)console.log(k,JSON.stringify(r));
          }
          NODE
          true
