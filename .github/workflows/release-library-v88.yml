name: Release Library Bilingual Editions v88
on:
  push:
    branches: [frontend-prd-v13-2026-10-08, release/chinese-library-v88-20261121]
    paths: [backend/library-v88.trigger, .github/workflows/release-library-v88.yml]
permissions:
  contents: read
concurrency:
  group: paper-adventure-backend-stage
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.ref == 'refs/heads/release/chinese-library-v88-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node scripts/library-v88-rollback-tag.mjs --create
        env:
          GH_TOKEN: ${{ github.token }}
  release:
    if: github.ref == 'refs/heads/frontend-prd-v13-2026-10-08'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      LIBRARY_RELEASE: v88
      PAYMENTS_EXPECTED_MODE: live
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/library-v88-rollback-tag.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npm run build
      - run: npm run test:backend
      - run: npm run test:release
      - name: Prepare pinned deployment tool
        run: |
          npm install --prefix "$RUNNER_TEMP/library-tools" wrangler@4.149.0
          echo "WRANGLER_CLI=$RUNNER_TEMP/library-tools/node_modules/wrangler/bin/wrangler.js" >> "$GITHUB_ENV"
      - name: Resolve existing database and save recovery bookmark
        run: |
          node "$WRANGLER_CLI" d1 info paper-adventure-stage-db --json > "$RUNNER_TEMP/library-d1.json"
          node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/library-d1.json','utf8'));const id=d.uuid||d.result?.uuid||d.database?.uuid;if(!/^[0-9a-f-]{36}$/i.test(id||''))throw Error('D1 UUID missing');fs.appendFileSync(process.env.GITHUB_ENV,'PAPER_ADVENTURE_STAGE_D1_ID='+id+'\n')"
          node "$WRANGLER_CLI" d1 time-travel info paper-adventure-stage-db --json > "$RUNNER_TEMP/library-recovery-bookmark.json"
      - run: node scripts/write-stage-wrangler.mjs
      - run: node scripts/verify-chinese-free-production.mjs --capture-english
      - name: Deploy matching API with Library publication disabled
        run: node "$WRANGLER_CLI" deploy --config backend/wrangler.stage.generated.jsonc --keep-vars --var PAID_LIBRARY_EDITIONS_ENABLED:false
      - name: Release eight private Library PDFs and isolated edition rows
        run: node scripts/release-library-v88.mjs
      - name: Deploy matching API and enable this paid language feature
        run: node "$WRANGLER_CLI" deploy --config backend/wrangler.stage.generated.jsonc --keep-vars --var PAID_READY_ZH_ENABLED:true --var PAID_MUSEUM_EDITIONS_ENABLED:true --var PAID_LIBRARY_EDITIONS_ENABLED:true
      - name: Verify paid-language publication and preserved public runtime
        run: |
          node scripts/verify-library-production.mjs --wait
          node scripts/verify-museum-production.mjs --wait
          node scripts/verify-chinese-ocean-production.mjs --wait
          node scripts/verify-chinese-free-production.mjs --wait --compare-english
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: library-release-v88-${{ github.sha }}
          path: |
            ${{ runner.temp }}/library-*.json
            ${{ runner.temp }}/zh-release-*.json
            output/pdf/library-classroom-en-1.1/manifest.json
            output/pdf/library-classroom-zh-1.0-zh.1/manifest.json
          if-no-files-found: warn
          retention-days: 30
