name: Private DeepSeek story-to-PDF smoke

on:
  push:
    branches:
      - frontend-prd-v13-2026-10-08
    paths:
      - backend/deepseek-smoke.trigger

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.DEEPSEEK_KEY || secrets.DEEPSEEK_API_TOKEN }}
      DEEPSEEK_MODEL: deepseek-flash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:backend
      - name: Check private DeepSeek credential
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "No DeepSeek key found under DEEPSEEK_API_KEY, DEEPSEEK_KEY, or DEEPSEEK_API_TOKEN in this repository's Actions secrets"
            exit 1
          fi
      - name: Generate Home and Classroom PDFs with DeepSeek
        run: node scripts/deepseek-smoke.mjs
