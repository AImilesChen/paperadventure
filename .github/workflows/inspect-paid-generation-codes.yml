name: Inspect paid generation phase codes
on:
  workflow_dispatch:
    inputs:
      order_id:
        description: Paid custom order UUID to inspect
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ORDER_ID: ${{ inputs.order_id }}
    steps:
      - name: Validate order identifier
        run: node -e "if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(process.env.ORDER_ID||'')) throw Error('Invalid order identifier')"
      - name: Classify blueprint validation reason only
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT phase,stage_number,status,error_code,error_detail FROM custom_generation_calls WHERE order_id = '${ORDER_ID}' ORDER BY created_at,id" > "$RUNNER_TEMP/generation-codes.json"
          node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/generation-codes.json','utf8'));const rows=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];const classify=v=>{const s=String(v||'').toLowerCase();if(/printable|print fit|too long|character limit|page limit/.test(s))return 'PRINT_FIT';if(/record fact|both printed|two printed/.test(s))return 'RECORD_FACTS';if(/story link|story spine|discover|consequence|finding|supports? (the )?final action|final action/.test(s))return 'STORY_LINK';if(/ending|closing|outcome|celebration/.test(s))return 'CLOSING';if(/material|paper piece|printed piece|clue|tile/.test(s))return 'MATERIAL';if(/format|schema|json|response|missing|required|invalid field/.test(s))return 'FIELD_FORMAT';return 'OTHER'};for(const r of rows.filter(x=>x.status==='failed'))console.log(JSON.stringify({phase:r.phase,stage_number:r.stage_number,error_code:r.error_code,reason_category:classify(r.error_detail),checkpoint_hint:Number((String(r.error_detail||'').match(/checkpoint\s+([1-5])/i)||[])[1]||0)}));console.log('Failure rows:',rows.filter(x=>x.status==='failed').length)"
