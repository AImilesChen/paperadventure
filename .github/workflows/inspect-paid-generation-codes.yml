name: Inspect paid generation phase codes
on:
  workflow_dispatch:
    inputs:
      order_id:
        description: Paid custom order UUID to inspect
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ORDER_ID: ${{ inputs.order_id }}
    steps:
      - name: Validate order identifier
        run: node -e "if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(process.env.ORDER_ID||'')) throw Error('Invalid order identifier')"
      - name: Read phase categories only
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT phase,stage_number,status,error_code FROM custom_generation_calls WHERE order_id = '${ORDER_ID}' ORDER BY created_at,id" > "$RUNNER_TEMP/generation-codes.json"
          node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/generation-codes.json','utf8'));const rows=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];for(const r of rows)console.log(JSON.stringify({phase:r.phase,stage_number:r.stage_number,status:r.status,error_code:r.error_code}));console.log('Call rows:',rows.length)"
