name: Temporary F72 semantic diagnosis
on:
  push:
    branches: [codex-remake-diagnostic-20261015]
    paths: [.github/workflows/private-remake-semantic.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Read only this order into runner temporary storage
        shell: bash
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT phase,status,error_detail,result_json,created_at FROM custom_pack_remake_calls WHERE order_id='f72e24d9-6a9e-4f1f-8d16-af1432b459bd' AND quality_epoch=2 AND phase IN ('blueprint','audit') AND status='failed' ORDER BY created_at DESC,id DESC LIMIT 10" > "$RUNNER_TEMP/private-row.json"
          node - "$RUNNER_TEMP/private-row.json" "$RUNNER_TEMP/semantic-summary.json" <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync(process.argv[2],'utf8');
          const start=raw.indexOf('[');
          if(start<0)throw Error('No D1 result array');
          const rows=JSON.parse(raw.slice(start))[0]?.results||[];
          if(!rows.length)throw Error('No failed calls for this order');
          const report=rows.map(row=>{
            let data=null;
            try{data=JSON.parse(row.result_json||'null')}catch{}
            const stages=Array.isArray(data?.stages)?data.stages.map((stage,index)=>{
              const context=stage.material?.logic?.context;
              return {checkpoint:index+1,labels:context?.labels||stage.material?.items?.map(item=>typeof item==='string'?item:item.label)||[],
                features:context?.features||stage.features||[],word:context?.word||stage.word||null};
            }):null;
            return {phase:row.phase,at:row.created_at,reviewReason:row.error_detail,checkpoints:stages,
              auditIssues:Array.isArray(data?.issues)?data.issues:null};
          });
          fs.writeFileSync(process.argv[3],JSON.stringify(report,null,2),{mode:0o600});
          NODE
          echo 'Limited semantic summary prepared without printing order text.'
      - name: Upload one-day diagnostic attachment
        uses: actions/upload-artifact@v4
        with:
          name: f72-semantic-diagnosis
          path: ${{ runner.temp }}/semantic-summary.json
          retention-days: 1
          if-no-files-found: error
