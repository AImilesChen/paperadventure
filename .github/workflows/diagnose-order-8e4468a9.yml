name: Diagnose order 8E4468A9 safely
on:
  push:
    branches: [diagnose-order-8e4468a9]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ORDER_ID: '8e4468a9-9847-43ae-b1b7-20e05c32f807'
    steps:
      - name: Read safe failure categories
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT phase,stage_number,status,error_code,error_detail FROM custom_generation_calls WHERE order_id = '${ORDER_ID}' ORDER BY created_at,id" > "$RUNNER_TEMP/calls.json"
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT attempt,status,phase,error_code,error_detail FROM generation_usage WHERE order_id = '${ORDER_ID}' ORDER BY attempt" > "$RUNNER_TEMP/usage.json"
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT phase,error_code,status FROM custom_delivery_incidents WHERE order_id = '${ORDER_ID}'" > "$RUNNER_TEMP/incident.json"
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT phase,calls,error_code,candidate_json IS NOT NULL AS candidate_saved,normalized_json IS NOT NULL AS normalized_saved,audit_json IS NOT NULL AS audit_saved FROM custom_delivery_copy WHERE order_id = '${ORDER_ID}'" > "$RUNNER_TEMP/copy.json"
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "WITH c AS (SELECT error_detail FROM custom_delivery_copy WHERE order_id = '${ORDER_ID}'), m AS (SELECT trim(rtrim(substr(error_detail,instr(lower(error_detail),'player material: ')+length('player material: ')),'.')) AS missing FROM c) SELECT CASE WHEN EXISTS (SELECT 1 FROM custom_game_stages s,m WHERE s.order_id = '${ORDER_ID}' AND length(m.missing)>0 AND instr(lower(s.stage_json),lower(m.missing))>0) THEN 1 ELSE 0 END AS present_in_any_saved_stage" > "$RUNNER_TEMP/cross.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const rows=p=>{const d=JSON.parse(fs.readFileSync(p,'utf8'));return Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[]};
          const classify=v=>{const s=String(v||'').toLowerCase();if(/keep the approved title, opening and english printable language/.test(s))return 'APPROVED_TEXT_MISMATCH';if(/final action must use all four earlier result digits/.test(s))return 'FINAL_DIGITS_MISMATCH';if(/story paragraphs must end with complete sentences/.test(s))return 'INCOMPLETE_STORY_SENTENCE';if(/changed its checked puzzle contract/.test(s))return 'PUZZLE_CONTRACT_CHANGED';if(/printed rules could not be independently verified/.test(s))return 'PRINTED_PROOF_INVALID';if(/record fact|both printed|two printed/.test(s))return 'RECORD_FACTS';if(/story link consequence must name a printed piece/.test(s))return 'UNRELATED_CONSEQUENCE';if(/story link does not name part of the final action/.test(s))return 'NO_ACTION_SUPPORT';if(/at least three checkpoint discoveries must print|at least three discoveries must directly name/.test(s))return 'INSUFFICIENT_ACTION_SUPPORT';if(/story link must cite both printed record facts/.test(s))return 'MISSING_RECORD_FACTS';if(/story link promises another investigation/.test(s))return 'FUTURE_INVESTIGATION';if(/story link must state both the checked finding/.test(s))return 'MISSING_FINDING_OR_CONSEQUENCE';if(/story link must explain why/.test(s))return 'NO_CAUSAL_EXPLANATION';if(/story link needs a fictional reason/.test(s))return 'NO_FICTIONAL_REASON';if(/story link must contain complete sentences/.test(s))return 'INCOMPLETE_LINK_SENTENCE';if(/ending|closing|outcome|celebration/.test(s))return 'CLOSING';if(/printable|print fit|too long|character limit|page limit/.test(s))return 'PRINT_FIT';if(/material|paper piece|printed piece|clue|tile/.test(s))return 'MATERIAL';if(/story link|story spine|discover|consequence|finding|supports? (the )?final action|final action/.test(s))return 'STORY_LINK';if(/format|schema|json|response|missing|required|invalid field/.test(s))return 'FIELD_FORMAT';return 'OTHER'};
          for(const r of rows(process.env.RUNNER_TEMP+'/calls.json')) console.log(JSON.stringify({source:'call',phase:r.phase,stage_number:r.stage_number,status:r.status,error_code:r.error_code,nested_code:(String(r.error_detail||'').match(/\\b(?:GENERATION_INVALID|GENERATION_QA_FAILED|PRINTED_PROOF_INVALID|STORY_CHECKPOINT_MISMATCH|BLUEPRINT_INVALID|STAGE_INVALID|AUDIT_INVALID|GENERATION_UPSTREAM_FAILED)\\b/)||[])[0]||null,reason_category:r.status==='failed'?classify(r.error_detail):null,checkpoint_hint:Number((String(r.error_detail||'').match(/checkpoint\s+([1-5])/i)||[])[1]||0)}));
          for(const r of rows(process.env.RUNNER_TEMP+'/usage.json')) console.log(JSON.stringify({source:'usage',attempt:r.attempt,status:r.status,phase:r.phase,error_code:r.error_code,nested_code:(String(r.error_detail||'').match(/\\b(?:GENERATION_INVALID|GENERATION_QA_FAILED|PRINTED_PROOF_INVALID|STORY_CHECKPOINT_MISMATCH|BLUEPRINT_INVALID|STAGE_INVALID|AUDIT_INVALID|GENERATION_UPSTREAM_FAILED)\\b/)||[])[0]||null,reason_category:r.status==='failed'?classify(r.error_detail):null,checkpoint_hint:Number((String(r.error_detail||'').match(/checkpoint\s+([1-5])/i)||[])[1]||0)}));
          for(const r of rows(process.env.RUNNER_TEMP+'/incident.json')) console.log(JSON.stringify({source:'incident',phase:r.phase,status:r.status,error_code:r.error_code}));
          for(const r of rows(process.env.RUNNER_TEMP+'/cross.json')) console.log(JSON.stringify({source:'cross_stage',present:!!r.present_in_any_saved_stage}));
          const copyRule=v=>{const s=String(v||'').toLowerCase();if(/printed edition is incomplete/.test(s))return 'COPY_SHAPE';if(/closing needs|closing.*printable|outcome and a character response/.test(s))return 'CLOSING_FORMAT';if(/action .*label/.test(s))return 'ACTION_LABEL_LENGTH';if(/action .*instructions/.test(s))return 'ACTION_INSTRUCTION_LENGTH';if(/final actions need complete instructions/.test(s))return 'ACTION_GRAMMAR';if(/final actions must differ/.test(s))return 'ACTIONS_NOT_DISTINCT';if(/story event/.test(s))return 'SCENE_FORMAT';if(/printed piece identities/.test(s))return 'LABEL_COUNT_OR_DUPLICATE';if(/printed piece label/.test(s))return 'LABEL_LENGTH';if(/final labels must match/.test(s))return 'FINAL_LABEL_MISMATCH';if(/key rows cannot change/.test(s))return 'KEY_LABEL_MISMATCH';if(/checked route names/.test(s))return 'ROUTE_LABEL_MISMATCH';if(/order tiles need complete/.test(s))return 'ORDER_TILE_GRAMMAR';if(/record stages need exactly two facts/.test(s))return 'RECORD_FACT_COUNT';if(/positive printed fact|alternative printed fact/.test(s))return 'FACT_LENGTH_OR_SENTENCE';if(/printed facts must be statements/.test(s))return 'FACT_KEYWORD_FORMAT';if(/each printed fact must be one sentence/.test(s))return 'FACT_SENTENCE_COUNT';if(/shared record facts/.test(s))return 'FACT_NAMES_CANDIDATE';if(/printed record facts must differ/.test(s))return 'FACTS_NOT_DISTINCT';if(/must cite an exact printed finding|fact reference is out of range/.test(s))return 'CITATION_BINDING';if(/story consequence|cited printed fact/.test(s))return 'LINK_FORMAT';return 'OTHER'};
          for(const r of rows(process.env.RUNNER_TEMP+'/copy.json')) console.log(JSON.stringify({source:'copy_state',phase:r.phase,calls:r.calls,error_code:r.error_code,candidate_saved:!!r.candidate_saved,normalized_saved:!!r.normalized_saved,audit_saved:!!r.audit_saved}));
          NODE
