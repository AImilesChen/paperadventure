name: Verify Journey repair with one bounded provider case
on:
  push:
    branches: [codex-journey-coherent-repair-20261016]
    paths:
      - '.github/workflows/verify-journey-repair.yml'
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/download-artifact@v5
        with:
          name: synthetic-journey-review
          run-id: 38930075614
          github-token: ${{ github.token }}
          path: tmp/previous-provider-contract
      - name: Resume saved mythology output; twenty calls across runs
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMOKE_REPLAY_DIR: tmp/previous-provider-contract
          SMOKE_CASE_IDS: classroom-journey
          SMOKE_MAX_PROVIDER_CALLS: '20'
        run: node scripts/paper-contract-provider-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-journey-review
          path: tmp/provider-contract
          retention-days: 1
