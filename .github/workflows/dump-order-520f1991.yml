name: Dump order 520f1991 orders
on:
  push:
    branches: [dump-order-520f1991]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Dump orders row
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT id, status, product_kind, json_extract(purchase_spec_json,'$.packQualityVersion') AS qv, length(purchase_spec_json) AS len FROM orders WHERE id='520f1991-da40-4d70-a9f9-11ff0d8641bc'" > "$RUNNER_TEMP/o.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/o.json','utf8'));
          const rows=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];
          console.log('ORDER_ROWS', rows.length);
          for(const r of rows) console.log('ORDER', JSON.stringify(r));
          NODE
