name: Dump order 520f1991 calls
on:
  push:
    branches: [dump-order-520f1991]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Dump generation calls
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT phase, stage_number, status, error_code, error_detail, input_tokens, output_tokens, created_at, completed_at FROM custom_generation_calls WHERE order_id='520f1991-da40-4d70-a9f9-11ff0d8641bc' ORDER BY created_at DESC, id DESC LIMIT 12" > "$RUNNER_TEMP/g.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/g.json','utf8'));
          const rows=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];
          console.log('GEN_CALL_ROWS', rows.length);
          for(const r of rows) console.log('GEN_CALL', JSON.stringify(r));
          NODE
