name: Dump order 520f1991 actions
on:
  push:
    branches: [dump-order-520f1991]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Dump candidate actions
        run: |
          OID='520f1991-da40-4d70-a9f9-11ff0d8641bc'
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT candidate_json FROM custom_delivery_copy WHERE order_id='$OID'" > "$RUNNER_TEMP/ca.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/ca.json','utf8'));
          const rows=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];
          for(const r of rows){
            try{ const c=JSON.parse(r.candidate_json||'null'); console.log('ACTIONS', JSON.stringify(c&&c.actions)); console.log('CELEBRATION', JSON.stringify(c&&c.celebration)); }catch(e){ console.log('CANDIDATE_RAW', String(r.candidate_json).slice(0,800)); }
          }
          NODE
