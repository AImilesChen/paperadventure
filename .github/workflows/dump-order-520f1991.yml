name: Dump order 520f1991 state
on:
  push:
    branches: [dump-order-520f1991]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Dump plan order
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT * FROM custom_plan_orders WHERE order_id='520f1991-da40-4d70-a9f9-11ff0d8641bc'" > "$RUNNER_TEMP/p.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/p.json','utf8'));
          const rows=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];
          console.log('PLAN_ORDER_ROWS', rows.length);
          for(const r of rows) console.log('PLAN_ORDER', JSON.stringify(r));
          NODE
      - name: Dump plan requests
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT * FROM custom_plan_requests WHERE order_id='520f1991-da40-4d70-a9f9-11ff0d8641bc' ORDER BY created_at DESC LIMIT 5" > "$RUNNER_TEMP/q.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/q.json','utf8'));
          const rows=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];
          console.log('PLAN_REQ_ROWS', rows.length);
          for(const r of rows) console.log('PLAN_REQ', JSON.stringify(r));
          NODE
      - name: Dump activity
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT * FROM custom_activities WHERE order_id='520f1991-da40-4d70-a9f9-11ff0d8641bc'" > "$RUNNER_TEMP/a.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/a.json','utf8'));
          const rows=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];
          console.log('ACTIVITY_ROWS', rows.length);
          for(const r of rows) console.log('ACTIVITY', JSON.stringify(r));
          NODE
