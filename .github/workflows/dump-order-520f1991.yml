name: Redo order 520f1991 retry3
on:
  push:
    branches: [dump-order-520f1991]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Clear and requeue
        run: |
          OID='520f1991-da40-4d70-a9f9-11ff0d8641bc'
          for t in custom_game_blueprints custom_game_stages custom_story_checkpoints custom_game_audits custom_generation_calls custom_delivery_copy custom_delivery_fact_repairs custom_delivery_copy_revisions; do
            npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "DELETE FROM $t WHERE order_id='$OID'" > "$RUNNER_TEMP/del_$t.json" 2>/dev/null
          done
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "UPDATE custom_delivery_incidents SET status='resolved' WHERE order_id='$OID'" > /dev/null 2>&1
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "UPDATE custom_activities SET status='queued', lease_until=NULL, pipeline_failures=0 WHERE order_id='$OID'" > /dev/null
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "UPDATE orders SET status='fulfilling' WHERE id='$OID'" > /dev/null
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT a.status AS activity_status, o.status AS order_status FROM custom_activities a JOIN orders o ON o.id=a.order_id WHERE a.order_id='$OID'" > "$RUNNER_TEMP/verify.json"
          node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/verify.json','utf8'));const r=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];console.log('VERIFY',JSON.stringify(r));"
