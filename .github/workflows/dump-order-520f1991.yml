name: Check order 520f1991 final2
on:
  push:
    branches: [dump-order-520f1991]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check result
        run: |
          OID='520f1991-da40-4d70-a9f9-11ff0d8641bc'
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT a.status AS activity_status, a.published_at, o.status AS order_status, dc.error_code AS copy_error, dc.phase AS copy_phase, dc.calls AS copy_calls, dc.audit_passed FROM custom_activities a LEFT JOIN orders o ON o.id=a.order_id LEFT JOIN custom_delivery_copy dc ON dc.order_id=a.order_id WHERE a.order_id='$OID'" > "$RUNNER_TEMP/st.json"
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT phase,error_code,error_detail,status FROM generation_usage WHERE order_id='$OID' ORDER BY attempt DESC LIMIT 2" > "$RUNNER_TEMP/u.json"
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT COUNT(*) AS n FROM artifact_versions av JOIN custom_activities ca ON ca.id=av.custom_activity_id WHERE ca.order_id='$OID' AND av.status='published'" > "$RUNNER_TEMP/art.json"
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT audit_json FROM custom_delivery_copy WHERE order_id='$OID'" > "$RUNNER_TEMP/au.json"
          node - <<'NODE'
          const fs=require('node:fs');
          for(const [k,f] of [['STATUS','st'],['USAGE','u'],['ARTIFACTS','art']]){
            try{ const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+f+'.json','utf8')); const rows=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[]; for(const r of rows) console.log(k, JSON.stringify(r)); }catch(e){ console.log(k+'_ERR', e.message); }
          }
          try{ const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/au.json','utf8')); const rows=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[]; for(const r of rows){ const a=JSON.parse(r.audit_json||'null'); console.log('AUDIT_PASS',a&&a.pass,'AUDIT_ISSUES',JSON.stringify(a&&a.issues)); } }catch(e){ console.log('AUDIT_ERR', e.message); }
          NODE
