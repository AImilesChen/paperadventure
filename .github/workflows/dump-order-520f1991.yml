name: Dump stage2 content 520f1991
on:
  push:
    branches: [dump-order-520f1991]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Dump stage 2
        run: |
          OID='520f1991-da40-4d70-a9f9-11ff0d8641bc'
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT candidate_json FROM custom_delivery_copy WHERE order_id='$OID'" > "$RUNNER_TEMP/ca.json"
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/ca.json','utf8'));
          const rows=Array.isArray(d)?d.flatMap(x=>x.results||[]):d.results||[];
          for(const r of rows){
            const c=JSON.parse(r.candidate_json||'null');
            if(!c) continue;
            const s=c.stages&&c.stages[1];
            console.log('STAGE2', JSON.stringify(s));
            console.log('ACTIONS', JSON.stringify(c.actions));
          }
          NODE
