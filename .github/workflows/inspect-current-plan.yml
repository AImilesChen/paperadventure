name: Read authorized plan review categories only
on:
  push:
    branches: [codex-79bb-readonly-review-20261016]
    paths: [.github/workflows/inspect-current-plan.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Read only enum fields and numeric progress, no candidate or purchase text
        shell: bash
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT r.status,w.phase,w.provider_calls,w.error_code,p.active_version,p.confirmed_version,json_extract(w.checkpoint_json,'$.audit.pass') AS audit_pass,json_extract(w.checkpoint_json,'$.audit.issues[0].code') AS audit_code,json_extract(w.checkpoint_json,'$.audit.issues[0].fields') AS audit_fields,json_extract(w.checkpoint_json,'$.sceneRepairUsed') AS scene_repair_used,json_extract(w.checkpoint_json,'$.formatResumeUsed') AS format_resume_used FROM custom_plan_requests r JOIN custom_plan_work w ON w.request_id=r.id JOIN custom_plan_orders p ON p.order_id=r.order_id WHERE r.order_id='79bb86c7-93b0-4088-ba7a-4a04cd1b2f34' ORDER BY r.created_at DESC,r.rowid DESC LIMIT 1" > "$RUNNER_TEMP/safe-plan-categories.json"
          node - "$RUNNER_TEMP/safe-plan-categories.json" <<'NODE'
          const fs=require('node:fs'),raw=fs.readFileSync(process.argv[2],'utf8');
          const row=JSON.parse(raw.slice(raw.indexOf('[')))[0]?.results?.[0];
          if(!row)throw Error('No diagnostic categories found');
          const codes=['THEME_WEAK','GOAL_UNRESOLVED','SCENE_SEQUENCE','SETUP_MISMATCH','UNSUPPORTED_ACTIVITY'];
          const fields=['title','summary','premise','goal','themeAnchors','scene1','scene2','scene3','scene4','scene5'];
          let rejected=[];try{rejected=JSON.parse(row.audit_fields||'[]').filter(v=>fields.includes(v));}catch{}
          console.log(JSON.stringify({status:['failed','published','queued','generating'].includes(row.status)?row.status:null,phase:['failed','ready','auditing','repairing','correcting','validating'].includes(row.phase)?row.phase:null,calls:Number(row.provider_calls),errorCode:/^PLAN_[A-Z_]+$/.test(row.error_code||'')?row.error_code:null,active:Number(row.active_version),confirmed:Number(row.confirmed_version),auditPassed:row.audit_pass===1,auditCode:codes.includes(row.audit_code)?row.audit_code:null,rejectedFields:rejected,sceneRepairUsed:row.scene_repair_used===1,formatResumeUsed:row.format_resume_used===1}));
          NODE
