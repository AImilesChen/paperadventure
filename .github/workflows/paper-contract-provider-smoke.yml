name: Verify unified paper contract with real provider
on:
  push:
    branches: [codex-linked-pack-20261015, codex-theme-flow-smoke-20261017]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Run provider smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:backend
      - uses: actions/download-artifact@v6
        with:
          name: synthetic-paper-contract-packs
          run-id: '39021250119'
          github-token: ${{ github.token }}
          path: tmp/provider-replay
      - name: Generate only invented QA scenarios
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.DEEPSEEK_KEY || secrets.DEEPSEEK_API_TOKEN }}
          SMOKE_CASE_IDS: classroom-market
          SMOKE_MAX_PROVIDER_CALLS: '44'
          SMOKE_REPLAY_DIR: tmp/provider-replay
        run: node scripts/paper-contract-provider-smoke.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: synthetic-paper-contract-packs
          path: tmp/provider-contract/
          retention-days: 1
