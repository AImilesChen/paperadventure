name: Verify unified paper contract with real provider
on:
  push:
    branches: [codex-linked-pack-20261015]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:backend
      - name: Generate only invented QA scenarios
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.DEEPSEEK_KEY || secrets.DEEPSEEK_API_TOKEN }}
        run: node scripts/paper-contract-provider-smoke.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: synthetic-paper-contract-packs
          path: tmp/provider-contract/
          retention-days: 1

