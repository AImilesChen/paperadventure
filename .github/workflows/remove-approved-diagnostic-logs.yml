name: Remove approved diagnostic logs
on:
  push:
    branches: [frontend-prd-v13-2026-10-08]
    paths: [.github/workflows/remove-approved-diagnostic-logs.yml]
permissions:
  actions: write
  contents: read
jobs:
  remove:
    if: github.repository == 'AImilesChen/paperadventure'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the user-approved diagnostic run logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --request DELETE \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2026-03-10' \
            https://api.github.com/repos/AImilesChen/paperadventure/actions/runs/38514458073/logs)
          test "$response" = '204'
          echo 'Approved diagnostic run logs deleted.'

