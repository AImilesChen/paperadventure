name: Resume saved checked delivery without another provider call
on:
  push:
    branches: [codex-controlled-pack-20261014]
    paths: [.github/workflows/resume-checked-delivery.yml, scripts/resume-checked-delivery.mjs]
permissions:
  contents: read
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ACCOUNT_ID: '77bc392d46985cd3425691358f5e8a77'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify only saved delivery state
        run: |
          npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT status,phase,blueprint_json IS NOT NULL AS blueprint_ready FROM custom_pack_remakes WHERE order_id='612a56bd-494a-4265-984f-f4ecb3eb7407'" > "$RUNNER_TEMP/checked-delivery-status.json"
      - name: Enqueue this existing saved order without regenerating its blueprint
        run: node scripts/resume-checked-delivery.mjs "$RUNNER_TEMP/checked-delivery-status.json"
      - name: Confirm the new artifact is published
        run: |
          for attempt in {1..20}; do
            npx --yes wrangler@4.74.0 d1 execute paper-adventure-stage-db --remote --json --command "SELECT status,phase,published_version,json_array_length(stages_json) AS saved_checkpoints FROM custom_pack_remakes WHERE order_id='612a56bd-494a-4265-984f-f4ecb3eb7407'" > "$RUNNER_TEMP/checked-delivery-status.json"
            state=$(node -e "const fs=require('node:fs');const d=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));const r=d.flatMap(v=>v.results||[])[0];console.log(r.status+' '+r.phase+' '+r.saved_checkpoints+' '+(r.published_version||0))" "$RUNNER_TEMP/checked-delivery-status.json")
            echo "Delivery status: $state"
            if [[ "$state" == ready* ]]; then exit 0; fi
            if [[ "$state" == failed* ]]; then exit 1; fi
            sleep 15
          done
          exit 1
